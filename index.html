<!--
=====================================================================
  MENTI-MENTOR by CognoSpace  —  single-file live polling app
  ---------------------------------------------------------------
  * Works out of the box in DEMO MODE (localStorage + BroadcastChannel):
    open Presenter in one tab and User mode in another tab of the SAME
    browser to see live voting.
  * Multi-device sync uses Firebase REALTIME DATABASE. Set
    CONFIG.USE_FIREBASE = true, paste your web config into
    CONFIG.firebaseConfig and make sure databaseURL matches the URL shown
    on Realtime Database → Data.
  * Change the presenter password: put the SHA-256 hex of your new
    password into CONFIG.PRESENTER_PASSWORD_SHA256.
  * Use your real logo: set CONFIG.LOGO_URL to an image URL.
=====================================================================
-->
<style>
:root{
  --navy:#1B2559;--navy2:#2B3674;--ink:#1B2559;--muted:#6B7394;
  --orange:#FF7A1A;--amber:#FFB020;--pink:#FF5D8F;--mint:#19C79A;--sky:#3BA9FF;--violet:#7C5CFF;--yellow:#FFD23F;
  --bg:#F7F7FF;--card:#FFFFFF;--line:#ECECF8;--soft:#F2F0FF;
  --r:20px;--sh:var(--sh);--sh-sm:var(--sh-sm);
  --spring:cubic-bezier(.2,.9,.3,1.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4,.display{font-family:var(--fd);font-weight:600;letter-spacing:-.01em;line-height:1.1}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--yellow)}

/* ---------- Buttons / basics ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:800;font-size:15px;border:1.5px solid var(--edge);box-shadow:var(--sh-sm);background:#fff;white-space:nowrap;transition:transform .15s,box-shadow .15s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.btn:active{transform:translateY(1px) scale(.98);box-shadow:var(--sh-sm)}
.btn.primary{background:var(--orange);color:#fff}
.btn.navy{background:var(--grad-pri);color:#fff}
.btn.mint{background:var(--mint);color:#fff}
.btn.pink{background:var(--pink);color:#fff}
.btn.yellow{background:var(--yellow)}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn.ghost:hover{background:var(--soft);transform:none;box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.icon{padding:9px;border-radius:12px}
.btn.on{background:var(--yellow)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}
.card{background:var(--card);border:1.5px solid var(--edge);border-radius:var(--r);box-shadow:var(--sh)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label,.lbl{font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.input{width:100%;padding:11px 14px;border:2px solid #E2E3F3;border-radius:12px;background:#fff;font-size:15px;font-weight:700;outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(109,93,252,.15)}
textarea.input{resize:vertical;min-height:90px;line-height:1.45}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;font-weight:800;cursor:pointer;margin-bottom:14px;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--orange)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:900;border:1.5px solid var(--edge);background:#fff}
.ticon{display:inline-grid;place-items:center;width:30px;height:30px;flex:none}
.ticon svg{width:100%;height:100%;fill:currentColor}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* ---------- Logo ---------- */
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-link{display:block;flex:none;transition:transform .2s var(--spring)}
.brand-link:hover{transform:scale(1.04)}
.brand-logo{height:44px;width:auto;display:block}
.brand-sub{font-family:var(--fd);font-weight:700;font-size:24px;letter-spacing:-.01em;color:var(--orange);padding-left:14px;border-left:2px solid var(--line);line-height:1.1;white-space:nowrap;cursor:pointer}
.brand.light{background:#fff;padding:8px 14px;border-radius:14px;border:2px solid var(--orange);display:inline-flex}
@media (max-width:520px){.brand{gap:10px}.brand .brand-logo{height:36px}.brand-sub{font-size:17px;padding-left:10px}
  .aud-top .brand-sub{display:none}.nav .wrap{flex-wrap:wrap;row-gap:10px}.mf-mode{display:none}}
.brand-mark{width:42px;height:42px;flex:none}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-text b{font-family:var(--fd);font-weight:700;font-size:21px;letter-spacing:-.01em}
.brand-text b span{color:var(--orange)}
.brand-text small{font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.brand.light .brand-text b{color:#fff}.brand.light .brand-text small{color:#CFC6FF}

/* ---------- Toasts / modal ---------- */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--grad-pri);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:0 10px 30px rgba(36,38,77,.3);animation:toastIn .45s var(--spring)}
.toast.err{background:var(--pink)}.toast.ok{background:var(--mint)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}}
.modal-bg{position:fixed;inset:0;background:rgba(36,38,77,.45);backdrop-filter:blur(6px);z-index:1000;display:grid;place-items:center;padding:20px;animation:fade .25s}
.modal{width:min(480px,100%);max-height:90vh;overflow:auto;padding:28px;animation:modalIn .45s var(--spring)}
.modal.wide{width:min(860px,100%)}
.modal h3{font-size:26px;margin-bottom:6px}
.modal p.sub{color:var(--muted);font-weight:600;margin-bottom:20px}
@keyframes fade{from{opacity:0}}
@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(.94)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- Landing ---------- */
.nav{position:sticky;top:0;z-index:50;padding:14px 0;background:rgba(255,248,240,.82);backdrop-filter:blur(12px);border-bottom:2px solid transparent;transition:border-color .3s}
.nav.scrolled{border-color:var(--line)}
.wrap{width:min(1180px,100% - 40px);margin:0 auto}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.nav-links{display:flex;gap:6px;align-items:center}
.nav-links a{padding:8px 14px;border-radius:10px;font-weight:800;font-size:15px;transition:background .2s}
.nav-links a:hover{background:var(--soft)}
.hero{position:relative;padding:60px 0 90px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;z-index:-1;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.12)}}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;background:#fff;border:1.5px solid var(--edge);border-radius:999px;font-weight:800;font-size:13.5px;box-shadow:var(--sh-sm);animation:rise .7s var(--spring) both}
.pill i{width:24px;height:24px;border-radius:50%;background:var(--mint);display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px}
.hero h1{font-size:clamp(30px,3.6vw,46px);margin:6px 0 18px;animation:rise .7s .14s var(--spring) both;color:var(--navy)}
.bigname{display:block;font-family:var(--fd);font-weight:700;font-size:clamp(46px,5.8vw,84px);line-height:1;letter-spacing:-.02em;margin-top:22px;white-space:nowrap;
  background:linear-gradient(90deg,#FF8A00,#FF5D8F 45%,#7C5CFF 75%,#FF8A00);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise .7s .06s var(--spring) both,shine 6s linear infinite;padding-bottom:4px;margin-bottom:14px}
.bigname small{display:block;font-size:.2em;letter-spacing:.32em;text-transform:uppercase;-webkit-text-fill-color:var(--muted);color:var(--muted);margin-top:8px;font-family:var(--fb);font-weight:900}
@keyframes shine{to{background-position:200% center}}
@media (max-width:520px){.bigname{white-space:normal}}
.hl{position:relative;color:var(--orange);white-space:nowrap}
.hl svg{position:absolute;left:-2%;bottom:-12px;width:104%;height:22px}
.hl svg path{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.1s .7s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero p.lead{font-size:19px;font-weight:600;color:var(--muted);max-width:520px;line-height:1.55;animation:rise .7s .16s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:32px;animation:rise .7s .24s var(--spring) both}
.mode-btn{text-align:left;padding:22px;border-radius:22px;border:1.5px solid var(--edge);box-shadow:var(--sh);transition:transform .2s var(--spring),box-shadow .2s;position:relative;overflow:hidden;color:#fff}
.mode-btn:hover{transform:translateY(-3px) rotate(-.6deg);box-shadow:var(--sh-lg)}
.mode-btn:active{transform:translateY(1px) scale(.98);box-shadow:var(--sh-sm)}
.mode-btn.p{background:linear-gradient(135deg,#FF8A2B,#FF5D8F)}
.mode-btn.u{background:linear-gradient(135deg,#19C79A,#3BA9FF)}
.mode-btn .mi{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.25);display:grid;place-items:center;margin-bottom:14px}
.mode-btn .mi svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mode-btn h3{font-size:24px;margin-bottom:4px}
.mode-btn span{font-weight:700;font-size:14px;opacity:.92}
.mode-btn::after{content:"→";position:absolute;right:20px;top:18px;font-size:26px;font-weight:900;transition:transform .25s}
.mode-btn:hover::after{transform:translateX(5px)}
.quick{margin-top:22px;display:flex;align-items:center;gap:10px;font-weight:800;color:var(--muted);flex-wrap:wrap;animation:rise .7s .32s var(--spring) both}
.quick .input{width:170px;letter-spacing:.2em;font-size:16px;text-align:center}

.hero-vis{position:relative;height:520px}
.phone{position:absolute;left:12%;top:20px;width:270px;height:470px;background:#fff;border:2px solid var(--edge);border-radius:38px;box-shadow:var(--sh-lg);padding:22px 18px;animation:float 6s ease-in-out infinite}
.phone::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:70px;height:6px;border-radius:9px;background:#E2E3F3}
@keyframes float{50%{transform:translateY(-14px)}}
.phone .q{font-family:var(--fd);font-weight:600;font-size:19px;margin:14px 0 18px}
.phone .opt-demo{display:flex;align-items:center;gap:10px;padding:11px 12px;border:2px solid #E8E8F6;border-radius:13px;margin-bottom:10px;font-weight:800;font-size:14px}
.phone .opt-demo.sel{border-color:var(--orange);background:#F1EEFF;animation:pulseSel 3s infinite}
@keyframes pulseSel{0%,30%{border-color:#E8E8F6;background:#fff}40%,100%{border-color:var(--orange);background:#F1EEFF}}
.phone .opt-demo i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px}
.phone .send{margin-top:16px;width:100%;background:var(--grad-pri);color:#fff;padding:12px;border-radius:13px;font-weight:900;text-align:center}
.screen{position:absolute;right:0;top:70px;width:300px;padding:20px;animation:float 7s 1s ease-in-out infinite}
.screen h4{font-size:16px;margin-bottom:14px}
.bars-demo{display:flex;align-items:flex-end;gap:12px;height:150px;border-bottom:2px solid var(--line)}
.bars-demo div{flex:1;border-radius:9px 9px 3px 3px;animation:barDance 4s ease-in-out infinite;transform-origin:bottom}
@keyframes barDance{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.bars-demo-l{display:flex;gap:12px;margin-top:6px;font-size:11px;font-weight:800;color:var(--muted)}.bars-demo-l span{flex:1;text-align:center}
.cloud-card{position:absolute;right:30px;bottom:30px;width:260px;padding:18px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:center;animation:float 8s .5s ease-in-out infinite}
.cloud-card span{font-family:var(--fd);font-weight:600;animation:popIn .6s var(--spring) both}
.chip-live{position:absolute;left:0;top:250px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-weight:900;animation:float 5s .3s ease-in-out infinite}
.dot-live{width:11px;height:11px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 0 rgba(255,93,143,.6);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 12px rgba(255,93,143,0)}100%{box-shadow:0 0 0 0 rgba(255,93,143,0)}}
.emoji{position:absolute;font-size:28px;animation:emojiUp 5s linear infinite;opacity:0}
@keyframes emojiUp{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-260px) scale(1.2) rotate(20deg)}}

.marquee{background:var(--grad-pri);color:#fff;padding:16px 0;overflow:hidden;border-block:2px solid var(--edge);transform:rotate(-1.2deg);margin:0 -20px}
.marquee-in{display:flex;gap:46px;width:max-content;animation:marq 34s linear infinite}
.marquee-in span{display:flex;align-items:center;gap:12px;font-family:var(--fd);font-size:22px;font-weight:500}
.marquee-in .ticon{width:24px;height:24px}
@keyframes marq{to{transform:translateX(-50%)}}

section.sec{padding:100px 0}
.sec-head{text-align:center;max-width:680px;margin:0 auto 54px}
.eyebrow{display:inline-block;font-weight:900;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:12px}
.sec-head h2{font-size:clamp(34px,4.4vw,52px);margin-bottom:14px}
.sec-head p{font-size:18px;color:var(--muted);font-weight:600;line-height:1.55}
.types-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.type-card{padding:22px;transition:transform .25s var(--spring),box-shadow .25s;cursor:default}
.type-card:hover{transform:translateY(-4px) rotate(-.8deg);box-shadow:var(--sh-lg)}
.type-card .ti{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin-bottom:16px;border:1.5px solid var(--edge)}
.type-card .ti .ticon{width:30px;height:30px}
.type-card h4{font-size:21px;margin-bottom:6px}
.type-card p{color:var(--muted);font-weight:600;line-height:1.5;font-size:15px}
.reveal{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s var(--spring)}
.reveal.in{opacity:1;transform:none}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;position:relative}
.step{padding:30px;position:relative}
.step .n{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:var(--fd);font-size:26px;font-weight:700;color:#fff;border:1.5px solid var(--edge);margin-bottom:18px;box-shadow:var(--sh-sm)}
.step h4{font-size:23px;margin-bottom:8px}
.step p{color:var(--muted);font-weight:600;line-height:1.55}
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.feat{padding:26px;border-radius:22px;border:1.5px solid var(--edge)}
.feat .fi{font-size:34px;margin-bottom:14px}
.feat h4{font-size:20px;margin-bottom:6px}
.feat p{font-weight:600;line-height:1.5;opacity:.85}
.cta{margin:0 auto 100px;padding:56px;border-radius:32px;background:linear-gradient(120deg,var(--orange),var(--pink) 55%,var(--violet));color:#fff;border:2px solid var(--edge);box-shadow:var(--sh-lg);display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap;position:relative;overflow:hidden}
.cta h2{font-size:clamp(30px,4vw,46px);max-width:560px}
.cta::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.12);right:-80px;top:-120px}

footer.foot{background:var(--grad-pri);color:#C9CFEA;padding:70px 0 26px;border-top:4px solid var(--orange);position:relative;overflow:hidden}
.foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:40px}
.foot p{line-height:1.6;font-weight:600;margin-top:16px;max-width:340px}
.foot h5{font-family:var(--fd);font-size:17px;color:#fff;font-weight:600;margin-bottom:16px}
.foot ul{list-style:none;display:flex;flex-direction:column;gap:10px;font-weight:700}
.foot ul a:hover{color:var(--amber)}
.foot-bottom{margin-top:50px;padding-top:22px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700;font-size:14px}
.foot-wave{position:absolute;right:-40px;bottom:-60px;width:320px;opacity:.08;pointer-events:none}
.mini-foot{text-align:center;padding:20px;font-weight:700;color:var(--muted);font-size:13px}
.mini-foot b{color:var(--orange)}
.mini-foot a:hover b{text-decoration:underline}

/* ---------- Presenter dashboard ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 24px;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:40}
.dash{width:min(1180px,100% - 40px);margin:36px auto 60px}
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.dash-head h1{font-size:42px}
.pres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.pcard{overflow:hidden;display:flex;flex-direction:column;animation:rise .5s var(--spring) both;transition:transform .2s var(--spring),box-shadow .2s}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.pcard .cover{height:118px;position:relative;border-bottom:1.5px solid var(--edge);display:flex;align-items:flex-end;padding:14px;gap:6px}
.pcard .cover .ticon{width:34px;height:34px;color:#fff;filter:drop-shadow(2px 2px 0 rgba(36,38,77,.35))}
.pcard .code{position:absolute;top:12px;right:12px;background:#fff;border:1.5px solid var(--edge);border-radius:10px;padding:4px 10px;font-weight:900;letter-spacing:.08em;font-size:14px;cursor:pointer}
.pcard .body{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column}
.pcard h3{font-size:21px;margin-bottom:4px;word-break:break-word}
.pcard .meta{color:var(--muted);font-weight:700;font-size:13px;margin-bottom:16px}
.pcard .acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.new-card{border:3px dashed #CFCFEA;border-radius:var(--r);display:grid;place-items:center;min-height:270px;font-family:var(--fd);font-size:20px;font-weight:600;color:var(--muted);transition:all .25s;text-align:center;gap:10px}
.new-card:hover{border-color:var(--orange);color:var(--orange);background:#F1EEFF}
.new-card .plus{width:64px;height:64px;border-radius:20px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:36px;margin:0 auto 10px;border:1.5px solid var(--edge);box-shadow:var(--sh-sm);transition:transform .3s var(--spring)}
.new-card:hover .plus{transform:rotate(90deg) scale(1.08)}
.empty-dash{text-align:center;padding:40px;color:var(--muted);font-weight:700}

/* ---------- Login ---------- */
.lock-ico{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--orange),var(--pink));display:grid;place-items:center;margin-bottom:18px;border:1.5px solid var(--edge);box-shadow:var(--sh-sm)}
.lock-ico svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
.pw-wrap{position:relative}
.pw-wrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-weight:900;font-size:12px;color:var(--muted);padding:6px}

/* ---------- Editor ---------- */
.ed{display:grid;grid-template-columns:250px 1fr 340px;grid-template-rows:auto 1fr;height:100vh}
.ed-top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 18px;background:#fff;border-bottom:2px solid var(--line)}
.ed-top .title-in{flex:1;max-width:460px;font-family:var(--fd);font-size:20px;font-weight:600;border:2px solid transparent;background:transparent;padding:8px 12px;border-radius:12px;outline:none}
.ed-top .title-in:hover{background:var(--soft)}
.ed-top .title-in:focus{border-color:var(--orange);background:#fff}
.save-state{font-size:13px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px}
.save-state i{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.save-state.dirty i{background:var(--amber)}
.ed-side{background:#fff;border-right:2px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.thumb{position:relative;display:flex;gap:10px;padding:10px;border:2px solid var(--line);border-radius:14px;cursor:pointer;transition:all .2s;background:#fff;animation:rise .35s var(--spring) both}
.thumb:hover{border-color:#CFCFEA}
.thumb.sel{border-color:var(--orange);box-shadow:var(--sh-sm);background:#FAFAFF}
.thumb .num{font-weight:900;font-size:12px;color:var(--muted);width:16px}
.thumb .tc{flex:1;min-width:0}
.thumb .tc .ticon{width:22px;height:22px}
.thumb .tt{font-size:13px;font-weight:800;line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb .tools{position:absolute;right:6px;top:6px;display:none;gap:2px;background:#fff;border-radius:9px;padding:2px;border:1.5px solid var(--line)}
.thumb:hover .tools,.thumb.sel .tools{display:flex}
.thumb .tools button{width:24px;height:24px;border-radius:7px;font-size:13px;font-weight:900;display:grid;place-items:center}
.thumb .tools button:hover{background:var(--soft)}
.add-slide{border:2.5px dashed #CFCFEA;border-radius:14px;padding:14px;font-weight:900;color:var(--muted);transition:all .2s}
.add-slide:hover{border-color:var(--orange);color:var(--orange);background:#F1EEFF}
.clip-row{display:flex;gap:8px}
.clip-row .add-slide{flex:1;padding:10px 6px;font-size:13px;border-width:2px}
.clip-row .add-slide:disabled{opacity:.45;cursor:not-allowed;border-color:#CFCFEA;color:var(--muted);background:none}
.clip-list{max-height:50vh;overflow:auto;border:2px solid var(--line);border-radius:14px;padding:6px 12px;margin-bottom:14px}
.clip-list .chk{margin:0;padding:9px 0;border-bottom:1.5px solid var(--line);font-weight:700}
.clip-list .chk:last-child{border-bottom:none}
.clip-list .chk input,.clip-list .chk .ticon{flex:none}.clip-list .chk .ticon{width:20px;height:20px}
.clip-list .chk span.cl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-main{overflow:auto;padding:28px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(#E3E3F4 1.2px,transparent 1.2px) 0 0/22px 22px,var(--bg)}
.canvas-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.canvas{flex:1;min-height:440px;padding:34px;display:flex;flex-direction:column}
.ed-panel{background:#fff;border-left:2px solid var(--line);overflow:auto;padding:20px}
.ed-panel h4{font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.list-row{display:flex;gap:6px;align-items:center;margin-bottom:8px;animation:rise .3s var(--spring) both}
.list-row .bullet{width:12px;height:12px;border-radius:4px;flex:none}
.list-row .input{padding:9px 12px;font-size:14px}
.list-row .x{width:32px;height:32px;border-radius:10px;font-weight:900;color:var(--muted);flex:none}
.list-row .x:hover{background:#FFE8EE;color:var(--pink)}
.add-link{font-weight:900;color:var(--orange);font-size:14px;padding:6px 0;margin-bottom:14px}
.hint{font-size:13px;color:var(--muted);font-weight:600;line-height:1.5;background:var(--soft);padding:12px;border-radius:12px;margin-bottom:14px}
.imgprev{width:100%;border-radius:12px;border:2px solid var(--line);margin-bottom:10px;max-height:160px;object-fit:cover}
.type-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.type-pick button{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--line);border-radius:16px;text-align:left;font-weight:800;font-size:16px;transition:all .2s var(--spring);background:#fff}
.type-pick button:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:var(--sh-sm)}
.type-pick small{display:block;font-weight:600;color:var(--muted);font-size:12.5px;margin-top:2px}

/* ---------- Slide stage (shared presenter/editor) ---------- */
.q-chip{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.q-chip .ticon{width:20px;height:20px}
.q-title{font-size:clamp(26px,3.4vw,46px);margin:10px 0 26px;word-break:break-word}
.res{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:240px;position:relative}
.empty-res{text-align:center;color:var(--muted);font-weight:800;font-size:18px;padding:30px}
.empty-res .bounce{font-size:44px;display:block;margin-bottom:10px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.pop{animation:popIn .55s var(--spring) both}
@keyframes popIn{from{opacity:0;transform:scale(.4)}}
.grow-y{animation:growY .9s var(--spring) both;transform-origin:bottom}
@keyframes growY{from{transform:scaleY(0)}}
.grow-x{animation:growX .9s var(--spring) both;transform-origin:left}
@keyframes growX{from{transform:scaleX(0)}}
.seen{animation:none!important}

/* MC */
.mc-res{display:flex;gap:clamp(10px,2vw,28px);align-items:flex-end;height:min(46vh,380px);padding:0 10px}
.mc-col{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
.mc-val{text-align:center;margin-bottom:8px;display:flex;flex-direction:column}
.mc-val b{font-family:var(--fd);font-size:clamp(22px,2.6vw,34px);font-weight:600}
.mc-val span{font-weight:900;color:var(--muted);font-size:14px}
.mc-track{flex:1;display:flex;align-items:flex-end;border-bottom:2px solid var(--edge)}
.mc-fill{width:100%;border-radius:14px 14px 4px 4px;border:1.5px solid var(--edge);border-bottom:none;transition:height .8s var(--spring)}
.mc-lab{text-align:center;font-weight:800;margin-top:10px;font-size:clamp(13px,1.3vw,17px);word-break:break-word}
/* Word cloud */
.wc{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 22px;padding:10px;max-width:1000px;margin:0 auto}
.wc-w{font-family:var(--fd);font-weight:600;line-height:1.05;transition:font-size .6s var(--spring);display:inline-block;position:relative}
.wc-w.top{text-shadow:3px 3px 0 rgba(36,38,77,.15)}
.wc-n{font-family:var(--fb);font-weight:900;font-size:max(14px,.24em);vertical-align:super;margin-left:4px;padding:2px 9px;border-radius:99px;background:currentColor;line-height:1.3;display:inline-block;border:1.5px solid var(--edge)}
.wc-n b{color:#fff;font-weight:900}
/* Open ended */
.oe{columns:3 240px;column-gap:16px;max-height:52vh;overflow:auto;padding:6px}
.oe-card{break-inside:avoid;margin-bottom:16px;padding:16px 18px;border-radius:18px;background:#fff;border:1.5px solid var(--edge);box-shadow:inset 0 4px 0 var(--c),var(--sh-sm);font-weight:700;font-size:16.5px;line-height:1.45;word-break:break-word}
/* Scales / points rows */
.sc-row{display:grid;grid-template-columns:minmax(120px,26%) 1fr 64px;gap:18px;align-items:center;margin-bottom:22px}
.sc-lab{font-weight:800;font-size:17px;word-break:break-word}
.sc-track{position:relative;height:16px;border-radius:99px;background:#EEEEF9}
.sc-fill{position:absolute;inset:0 auto 0 0;border-radius:99px;opacity:.35;transition:width .8s var(--spring)}
.sc-dot{position:absolute;top:50%;width:30px;height:30px;border-radius:50%;border:2px solid var(--edge);transform:translate(-50%,-50%);transition:left .8s var(--spring),opacity .3s;box-shadow:var(--sh-sm)}
.sc-avg{font-family:var(--fd);font-size:26px;font-weight:600;text-align:right}
.sc-ends{display:grid;grid-template-columns:minmax(120px,26%) 1fr 64px;gap:18px;font-weight:800;color:var(--muted);font-size:13px;margin-top:-6px}
.sc-ends div:nth-child(2){display:flex;justify-content:space-between}
.pt-bar{height:34px;border-radius:10px;border:1.5px solid var(--edge);transition:width .8s var(--spring);min-width:4px}
/* Ranking */
.rk{position:relative}
.rk-row{position:absolute;left:0;right:0;height:58px;display:grid;grid-template-columns:44px minmax(110px,28%) 1fr;gap:14px;align-items:center;transition:top .8s var(--spring)}
.rk-n{width:40px;height:40px;border-radius:12px;background:var(--grad-pri);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:600;font-size:20px}
.rk-lab{font-weight:800;font-size:17px;word-break:break-word}
.rk-bar{height:30px;border-radius:9px;border:1.5px solid var(--edge);transition:width .8s var(--spring);min-width:4px}
/* Q&A */
.qa-list{display:flex;flex-direction:column;gap:12px;max-height:52vh;overflow:auto;padding:4px}
.qa-item{display:flex;gap:16px;align-items:center;padding:14px 16px;border:1.5px solid var(--edge);border-radius:18px;background:#fff;box-shadow:var(--sh-sm)}
.qa-item.done{opacity:.5;box-shadow:none}
.qa-up{min-width:58px;text-align:center;border-radius:14px;background:#FFE8EE;padding:6px;display:flex;flex-direction:column}
.qa-up b{font-family:var(--fd);font-size:24px;font-weight:600;color:var(--pink)}
.qa-up small{font-weight:900;font-size:10.5px;color:var(--muted);text-transform:uppercase}
.qa-text{flex:1;font-weight:700;font-size:17px;word-break:break-word}
/* Guess */
.gs{position:relative;padding:40px 10px 0}
.gs-bars{display:flex;align-items:flex-end;gap:4px;height:min(36vh,280px);border-bottom:2px solid var(--edge)}
.gs-bar{flex:1;border-radius:7px 7px 2px 2px;background:linear-gradient(var(--amber),var(--orange));transition:height .8s var(--spring);border:1.5px solid var(--edge);border-bottom:none}
.gs-bar.z{border:none;background:#EEEEF9}
.gs-axis{display:flex;justify-content:space-between;font-weight:900;color:var(--muted);margin-top:8px}
.gs-mark{position:absolute;top:0;bottom:30px;width:0;border-left:3px dashed var(--navy);transition:left .8s var(--spring)}
.gs-mark span{position:absolute;top:0;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--grad-pri);color:#fff;font-weight:900;font-size:13px;padding:4px 10px;border-radius:9px}
.gs-mark.ok{border-color:var(--mint)}.gs-mark.ok span{background:var(--mint)}
.gs-stats{display:flex;gap:26px;justify-content:center;margin-top:18px;font-weight:800;color:var(--muted)}
.gs-stats b{color:var(--ink);font-family:var(--fd);font-size:24px;font-weight:600;margin-left:6px}
/* 2x2 grid */
.gr-wrap{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.gr-box{position:relative;width:min(46vh,400px);aspect-ratio:1;border:2px solid var(--edge);border-radius:16px;background:
 linear-gradient(var(--navy),var(--navy)) center/2px 100% no-repeat,linear-gradient(var(--navy),var(--navy)) center/100% 2px no-repeat,
 linear-gradient(135deg,#F1EEFF 0 50%,#EAF6FF 50%);margin:10px 30px 34px 40px}
.gr-q{position:absolute;font-weight:900;font-size:11px;color:var(--muted);opacity:.7}
.gr-xl,.gr-yl{position:absolute;font-weight:900;font-size:13px;white-space:nowrap}
.gr-xl{bottom:-30px;left:50%;transform:translateX(-50%)}
.gr-yl{left:-34px;top:50%;transform:translate(-50%,-50%) rotate(-90deg)}
.gr-pt{position:absolute;width:9px;height:9px;border-radius:50%;transform:translate(-50%,50%);opacity:.35}
.gr-avg{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid var(--edge);transform:translate(-50%,50%);transition:left .8s var(--spring),bottom .8s var(--spring),opacity .3s;box-shadow:var(--sh-sm);z-index:2}
.gr-avg span{position:absolute;left:30px;top:50%;transform:translateY(-50%);white-space:nowrap;font-weight:900;font-size:13px;background:#fff;padding:2px 8px;border-radius:8px;border:1.5px solid var(--edge)}
.gr-legend{display:flex;flex-direction:column;gap:8px;font-weight:800}
.gr-legend i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;border:1.5px solid var(--edge);vertical-align:-2px}
/* Form */
.fm-count{font-family:var(--fd);font-size:20px;font-weight:600;margin-bottom:14px}
.fm-table{width:100%;border-collapse:separate;border-spacing:0;border:1.5px solid var(--edge);border-radius:14px;overflow:hidden;background:#fff}
.fm-table th{background:var(--grad-pri);color:#fff;text-align:left;padding:11px 14px;font-size:13px;letter-spacing:.04em}
.fm-table td{padding:10px 14px;border-top:1.5px solid var(--line);font-weight:700;font-size:14.5px;word-break:break-word}
.fm-scroll{max-height:48vh;overflow:auto}
/* Pin */
.pin-wrap{position:relative;display:inline-block;max-width:100%;margin:0 auto;border:2px solid var(--edge);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.pin-wrap img{display:block;max-width:100%;max-height:50vh;user-select:none;-webkit-user-drag:none}
.pin-dot{position:absolute;width:20px;height:20px;border-radius:50% 50% 50% 0;background:var(--violet);border:2.5px solid #fff;transform:translate(-50%,-100%) rotate(-45deg);box-shadow:0 3px 8px rgba(36,38,77,.4)}
.pin-dot.pop{animation:pinDrop .5s var(--spring) both}
@keyframes pinDrop{from{opacity:0;transform:translate(-50%,-260%) rotate(-45deg)}}

/* ---------- Present view ---------- */
.pv{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.pv-top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 26px;background:#fff;border-bottom:2px solid var(--line);flex-wrap:wrap}
.join-banner{display:flex;align-items:center;gap:14px;font-weight:800;font-size:16px}
.join-banner .codebig{font-family:var(--fd);font-weight:700;font-size:30px;letter-spacing:.06em;background:var(--yellow);padding:2px 14px;border-radius:12px;border:1.5px solid var(--edge);box-shadow:var(--sh-sm)}
.qr{width:74px;height:74px;padding:4px;background:#fff;border:1.5px solid var(--edge);border-radius:10px;cursor:zoom-in;transition:transform .25s var(--spring),box-shadow .25s}
.qr:hover{transform:scale(1.08) rotate(-2deg);box-shadow:var(--sh-sm)}
.join-banner .codebig{cursor:zoom-in}
.qr-modal{text-align:center}
.qr-modal .qr-big{width:min(62vh,78vw,460px);aspect-ratio:1;margin:18px auto;padding:14px;background:#fff;border:2px solid var(--edge);border-radius:22px;box-shadow:var(--sh);display:grid;place-items:center;animation:popIn .5s var(--spring)}
.qr-modal .qr-big img,.qr-modal .qr-big canvas{width:100%!important;height:100%!important;image-rendering:pixelated}
.qr-modal .code-xl{font-family:var(--fd);font-weight:700;font-size:clamp(44px,7vw,72px);letter-spacing:.08em;background:var(--yellow);display:inline-block;padding:2px 22px;border-radius:18px;border:2px solid var(--edge);box-shadow:var(--sh-sm);margin:6px 0 12px}
.qr-modal .url{font-weight:800;color:var(--muted);word-break:break-all;font-size:14px}
.qr img,.qr canvas{width:100%!important;height:100%!important}
.pv-stage{flex:1;display:flex;flex-direction:column;padding:34px clamp(20px,5vw,80px) 20px;width:100%;max-width:1400px;margin:0 auto}
.pv-stage .stage-anim{animation:rise .55s var(--spring) both;display:flex;flex-direction:column;flex:1}
.pv-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;flex-wrap:wrap}
.pv-bar .group{display:flex;gap:6px;background:#fff;padding:6px;border:1.5px solid var(--edge);border-radius:16px;box-shadow:var(--sh-sm)}
.pv-count{display:flex;align-items:center;gap:8px;font-weight:900}
.pv-count b{font-family:var(--fd);font-size:22px}
.hidden-res{text-align:center;padding:50px;font-family:var(--fd);font-size:26px;color:var(--muted)}
.hidden-res b{display:block;font-size:64px;color:var(--orange)}

/* ---------- Audience ---------- */
.aud{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#EFEBFF,var(--bg) 40%)}
.aud-top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:10px}
.aud-left{display:flex;align-items:center;gap:12px;min-width:0}
.home-btn{padding:7px 12px;gap:6px;background:#fff}
.home-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:520px){.aud-top{padding:12px 14px}.aud-left{gap:8px}.home-btn{padding:6px 10px;font-size:12.5px}.aud-top .tag{font-size:11px;padding:4px 9px}}
@media (max-width:420px){.aud-top .tag b{display:none}}
@media (max-width:370px){.aud-top .brand-logo{height:31px}.home-btn span{display:none}.home-btn{padding:7px}}
.aud-main{flex:1;width:min(560px,100% - 28px);margin:6px auto 20px}
.aud-card{padding:26px 22px;animation:rise .5s var(--spring) both}
.aud-card .q-title{font-size:clamp(24px,6vw,32px);margin:8px 0 22px}
.join-card{width:min(460px,100% - 28px);margin:7vh auto 20px;padding:34px 28px;text-align:center;animation:rise .6s var(--spring) both}
.join-card h1{font-size:36px;margin:16px 0 8px}
.code-in{font-family:var(--fd);font-size:38px;font-weight:600;letter-spacing:.3em;text-align:center;padding:14px;border:2px solid var(--edge);border-radius:18px;width:100%;outline:none;box-shadow:var(--sh-sm);margin:22px 0 16px;background:#fff}
.code-in:focus{background:#FFFBEA}
.anon{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-weight:800;font-size:13.5px;color:var(--muted)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;border:2.5px solid #E6E6F5;border-radius:16px;margin-bottom:11px;font-weight:800;font-size:16.5px;text-align:left;background:#fff;transition:all .2s var(--spring)}
.opt:hover{border-color:#C8C9E4}
.opt .lt{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:900;flex:none;font-size:14px;transition:transform .25s var(--spring)}
.opt.sel{border-color:var(--orange);background:#F4F1FF;box-shadow:var(--sh-sm);transform:translateY(-2px)}
.opt.sel .lt{transform:scale(1.15) rotate(-8deg)}
.submit{width:100%;margin-top:10px;padding:16px;font-size:17px}
.range{width:100%;accent-color:var(--orange);height:28px}
.rng-row{margin-bottom:22px}
.rng-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px;gap:10px}
.rng-head b{font-family:var(--fd);font-size:22px;color:var(--orange);min-width:34px;text-align:right}
.rng-ends{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--muted)}
.rk-item{display:flex;align-items:center;gap:10px;padding:12px 12px;border:1.5px solid var(--edge);border-radius:15px;margin-bottom:9px;background:#fff;font-weight:800;box-shadow:var(--sh-sm);transition:transform .25s var(--spring)}
.rk-item .n{width:28px;height:28px;border-radius:9px;background:var(--grad-pri);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.rk-item span{flex:1;word-break:break-word}
.rk-item button{width:34px;height:34px;border-radius:10px;background:var(--soft);font-weight:900;font-size:14px}
.rk-item button:disabled{opacity:.3}
.budget{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:14px;background:var(--grad-pri);color:#fff;font-weight:800;margin-bottom:18px;position:sticky;top:8px;z-index:2}
.budget b{font-family:var(--fd);font-size:26px;color:var(--yellow)}
.grid-item{padding:14px;border:2px solid var(--line);border-radius:16px;margin-bottom:12px}
.grid-item h5{font-size:17px;font-family:var(--fd);font-weight:600;margin-bottom:10px}
.big-num{font-family:var(--fd);font-size:64px;font-weight:700;text-align:center;color:var(--orange);line-height:1;margin:6px 0 14px}
.stepper{display:flex;gap:10px;align-items:center}
.stepper button{width:44px;height:44px;border-radius:13px;border:1.5px solid var(--edge);font-size:22px;font-weight:900;background:#fff;box-shadow:var(--sh-sm);flex:none}
.pin-pick{cursor:crosshair}
.thanks{text-align:center;padding:36px 16px}
.check{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:var(--mint);display:grid;place-items:center;border:2px solid var(--edge);box-shadow:var(--sh);animation:popIn .6s var(--spring)}
.check svg{width:48px;height:48px;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .3s forwards}
.thanks h2{font-size:30px;margin-bottom:8px}
.thanks p{color:var(--muted);font-weight:700}
.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);margin:0 3px;animation:bob 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.waiting{text-align:center;padding:50px 18px}
.waiting .orb{width:110px;height:110px;margin:0 auto 22px;border-radius:50%;background:conic-gradient(var(--orange),var(--pink),var(--violet),var(--sky),var(--mint),var(--orange));animation:spin 3s linear infinite;display:grid;place-items:center;border:2px solid var(--edge)}
.waiting .orb::after{content:"";width:74px;height:74px;border-radius:50%;background:var(--bg);border:2px solid var(--edge)}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
.progress i{width:22px;height:6px;border-radius:9px;background:#E6E6F5;transition:all .3s}
.progress i.on{background:var(--orange);width:34px}
.qa-mine{display:flex;gap:8px;margin-bottom:16px}
.upv{display:flex;flex-direction:column;align-items:center;min-width:52px;padding:6px;border-radius:12px;border:2px solid #E6E6F5;font-weight:900;transition:all .2s var(--spring)}
.upv.on{background:var(--pink);color:#fff;border-color:var(--orange);transform:scale(1.06)}
.upv span{font-size:16px;line-height:1}
.locked-note{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:#FFE8EE;font-weight:800;margin-bottom:14px}
.loader{display:grid;place-items:center;min-height:60vh}

/* ---------- Welcome slide ---------- */
.wel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding:10px 0 20px}
.wel-logo{height:clamp(70px,11vh,120px);width:auto;animation:popIn .7s var(--spring) both}
.wel-hi{font-family:var(--fd);font-weight:600;font-size:clamp(20px,2.4vw,30px);color:var(--muted);margin-top:26px;animation:rise .6s .15s var(--spring) both}
.wel-app{font-family:var(--fd);font-weight:700;font-size:clamp(48px,7vw,104px);line-height:1;letter-spacing:-.02em;margin:6px 0 4px;padding-bottom:6px;
  background:linear-gradient(90deg,#FF8A00,#FF5D8F 45%,#7C5CFF 75%,#FF8A00);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .6s .25s var(--spring) both,shine 6s linear infinite}
.wel-by{font-weight:900;letter-spacing:.24em;text-transform:uppercase;font-size:clamp(11px,1.1vw,14px);color:var(--orange);animation:rise .6s .32s var(--spring) both}
.wel-title{margin-top:30px;display:inline-block;max-width:min(900px,100%);padding:14px 30px;border-radius:20px;background:#fff;border:2px solid var(--edge);box-shadow:var(--sh);font-family:var(--fd);font-weight:600;font-size:clamp(24px,3.2vw,42px);word-break:break-word;animation:rise .6s .4s var(--spring) both}
.wel-title small{display:block;font-family:var(--fb);font-weight:900;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.wel-join{margin-top:30px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center;animation:rise .6s .5s var(--spring) both}
.wel-join .txt{font-weight:800;font-size:18px;text-align:left;line-height:1.5}
.wel-join .codebig{font-family:var(--fd);font-weight:700;font-size:clamp(34px,4vw,52px);letter-spacing:.06em;background:var(--yellow);padding:2px 18px;border-radius:14px;border:2px solid var(--edge);box-shadow:var(--sh-sm);cursor:zoom-in}
.wel-qr{width:140px;height:140px;padding:6px;background:#fff;border:2px solid var(--edge);border-radius:14px;box-shadow:var(--sh-sm);cursor:zoom-in}
.wel-qr img,.wel-qr canvas{width:100%!important;height:100%!important}
.wel-emo{position:absolute;font-size:34px;animation:float 6s ease-in-out infinite;opacity:.9}
.wel-card{text-align:center;padding:34px 22px}
.wel-card .wel-logo{height:64px}
.wel-card .wel-app{font-size:clamp(38px,11vw,54px)}
.wel-card .wel-title{font-size:22px;padding:12px 18px;margin-top:22px}
.wel-wait{margin-top:32px;font-family:var(--fd);font-weight:600;font-size:clamp(20px,2.6vw,32px);color:var(--navy);display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;animation:rise .6s .5s var(--spring) both}
.wel-card .wel-wait{font-size:19px;margin-top:22px}
.canvas .wel-app,.wel-app{white-space:nowrap}
.canvas .wel-app{font-size:clamp(36px,4.6vw,72px)}
.canvas .wel-logo{height:clamp(56px,8vh,96px)}
.canvas .wel-title{font-size:clamp(20px,2.2vw,32px)}
.wel-card .wel-app{font-size:clamp(34px,10.5vw,54px)}
.thumb[data-i]{cursor:grab}
.thumb[data-i]:active{cursor:grabbing}
.thumb .grip{position:absolute;left:3px;top:50%;transform:translateY(-50%);font-size:13px;color:#B9BAD6;line-height:1;letter-spacing:-2px}
.thumb.dragging{opacity:.35}
.thumb.drop-before{box-shadow:0 -4px 0 var(--orange)}
.thumb.drop-after{box-shadow:0 4px 0 var(--orange)}
@media (max-width:1000px){.thumb.drop-before{box-shadow:-4px 0 0 var(--orange)}.thumb.drop-after{box-shadow:4px 0 0 var(--orange)}}
.thumb.wel-thumb{cursor:default;background:linear-gradient(135deg,#F1EEFF,#F3EEFF);border-style:dashed}
.thumb.wel-thumb .tt{color:var(--ink)}
.thumb.wel-thumb small{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:2px}

/* ---------- Fastest Fingers First ---------- */
.ff-board{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:4px 8px 8px 4px}
.ff-row{display:grid;grid-template-columns:52px minmax(100px,1fr) 1.4fr 84px 36px;gap:14px;align-items:center;padding:12px 16px;border:1.5px solid var(--edge);border-radius:16px;background:#fff;box-shadow:var(--sh-sm)}
.ff-row.win{background:linear-gradient(90deg,#FFF0B8,#fff 70%);box-shadow:0 14px 34px -12px rgba(255,181,71,.55)}
.ff-row.no{opacity:.62}
.ff-row.me{outline:3px solid var(--orange);outline-offset:2px}
.ff-rank{width:44px;height:44px;border-radius:13px;background:var(--grad-pri);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:600;font-size:20px}
.ff-rank.m{background:none;font-size:32px}
.ff-name{font-weight:900;font-size:17px;word-break:break-word}
.ff-ans{font-weight:700;color:var(--muted);word-break:break-word}
.ff-time{font-family:var(--fd);font-weight:600;font-size:20px;text-align:right;white-space:nowrap}
.ff-mark{font-weight:900;font-size:20px;text-align:center}
.ff-mark.ok{color:var(--mint)}.ff-mark.bad{color:var(--pink)}
.ff-big{font-family:var(--fd);font-size:clamp(84px,13vw,170px);font-weight:700;text-align:center;line-height:1;color:var(--orange)}
.ff-big.low{color:var(--pink);animation:ffPulse 1s infinite}
@keyframes ffPulse{50%{transform:scale(1.07)}}
.ff-track{height:18px;border-radius:99px;background:#EEEEF9;border:1.5px solid var(--edge);overflow:hidden;width:min(700px,100%);margin:16px auto}
.ff-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--amber),var(--mint));transition:width .2s linear}
.ff-sub{text-align:center;font-weight:800;color:var(--muted);font-size:18px}
.ff-sub b{color:var(--ink);font-family:var(--fd);font-size:24px}
.ff-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:22px}
.ff-opt{padding:14px 16px;border:1.5px solid var(--edge);border-radius:16px;background:#fff;font-weight:800;font-size:18px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh-sm)}
.ff-opt.ok{background:#DBF8EE}
.ff-opt i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px;font-weight:900;flex:none}
.ff-state{text-align:center;padding:30px 10px}
.ff-state .em{font-size:72px;display:block;margin-bottom:8px;animation:bob 1.8s ease-in-out infinite}
.ff-state h2{font-size:clamp(30px,4vw,48px);margin-bottom:8px}
.ff-state p{color:var(--muted);font-weight:700;font-size:17px}
.ff-correct{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:12px;background:#DBF8EE;border:1.5px solid var(--edge);font-weight:900;margin-bottom:14px}
.ff-clock{display:flex;align-items:center;gap:12px;margin:-8px 0 18px}
.ff-clock .ff-track{margin:0;flex:1;height:14px}
.ff-clock b{font-family:var(--fd);font-size:28px;font-weight:700;color:var(--orange);min-width:58px;text-align:right}
.ff-clock b.low{color:var(--pink)}
.ff-me{text-align:center;padding:18px;border-radius:18px;background:var(--soft);border:2px dashed #DCDCF0;margin-bottom:16px}
.ff-me b{display:block;font-family:var(--fd);font-size:44px;color:var(--orange);line-height:1.1}
.ff-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--edge);background:#fff;font-weight:800;font-size:16px;box-shadow:var(--sh-sm);transition:transform .15s var(--spring),background .15s;text-align:left;word-break:break-word}
.chip:hover{transform:translateY(-1px)}
.chip.big{font-size:clamp(17px,1.8vw,24px);padding:12px 18px;border-radius:14px;box-shadow:var(--sh-sm)}
.chip i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--grad-pri);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.chip.placed{background:var(--yellow)}
.ord-lbl{font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.ord-ans{min-height:62px;border:2.5px dashed #D6D6EE;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;background:#FAFAFF}
.ord-ans.steps{flex-direction:column;align-items:stretch}
.ord-ans:empty::before{content:attr(data-ph);color:var(--muted);font-weight:800;font-size:14px;padding:4px}
.ord-bank{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;margin-bottom:6px}
.ord-tools{display:flex;justify-content:flex-end;margin-bottom:4px}
.bzr{display:block;width:min(270px,74vw);margin:6px auto 0;padding:0;border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation;outline:none}
.bzr svg{width:100%;height:auto;display:block;overflow:visible}
.bzr .dome{transition:transform .07s ease-out;transform-box:view-box}
.bzr .ring-glow{transition:opacity .15s;animation:bzrPulse 1.6s ease-in-out infinite}
.bzr .ring{transition:fill .1s}
.bzr:hover .dome{transform:translateY(2px)}
.bzr:active .dome,.bzr.hit .dome{transform:translateY(11px)}
.bzr.hit .ring-glow,.bzr.on .ring-glow{animation:none;opacity:1}
.bzr.hit .ring,.bzr.on .ring{fill:url(#bzRingHot)}
.bzr.hit .glow-c1,.bzr.on .glow-c1{stop-color:#FFE27A}.bzr.hit .glow-c2,.bzr.on .glow-c2{stop-color:#FF7A1A}
.bzr:focus-visible{filter:drop-shadow(0 0 0 3px var(--orange))}
.bzr:disabled{pointer-events:none}
.bzr.small{width:min(150px,42vw)}
@keyframes bzrPulse{0%,100%{opacity:.55}50%{opacity:1}}
.bzr-hint{text-align:center;font-weight:900;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 0 6px}
.bz-top{display:flex;align-items:center;gap:16px;width:min(760px,100%);margin:0 auto 18px}
.bz-top .ff-track{margin:0;flex:1}
.bz-top b{font-family:var(--fd);font-size:40px;font-weight:700;color:var(--orange);min-width:76px;text-align:right}
.bz-top b.low{color:var(--pink)}
.bz-pos{font-family:var(--fd);font-size:64px;font-weight:700;color:var(--pink);line-height:1;margin:6px 0}
.who{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--muted);margin-bottom:10px}
.who button{color:var(--orange);font-weight:900;text-decoration:underline}
.spinner{width:46px;height:46px;border-radius:50%;border:5px solid #E6E4FA;border-top-color:var(--orange);animation:spin .8s linear infinite}

/* ---------- Responsive ---------- */
@media (max-width:1000px){
  .hero .wrap{grid-template-columns:1fr}.hero-vis{height:480px;max-width:560px;margin:0 auto;width:100%}
  .feat-grid{grid-template-columns:1fr 1fr}.foot-grid{grid-template-columns:1fr 1fr}
  .ed{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;height:auto}
  .ed-side{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:2px solid var(--line)}
  .thumb{min-width:180px}.add-slide{min-width:130px}.clip-row{flex:none}
  .ed-panel{border-left:none;border-top:2px solid var(--line)}
}
@media (max-width:700px){
  .ff-row{grid-template-columns:40px 1fr 66px 26px;gap:8px 10px;padding:10px 12px}
  .ff-ans{grid-row:2;grid-column:2/-1;font-size:14px}
  .ff-rank{width:36px;height:36px;font-size:16px}.ff-rank.m{font-size:26px}
  .ff-time{font-size:17px}
  .nav-links a{display:none}.modes{grid-template-columns:1fr}.steps{grid-template-columns:1fr}
  .feat-grid{grid-template-columns:1fr}.foot-grid{grid-template-columns:1fr}
  .phone{left:0;transform:scale(.9)}.screen{width:240px}.cloud-card{width:210px;right:0}
  section.sec{padding:70px 0}.cta{padding:34px}
  .ed-top{flex-wrap:wrap}.canvas{padding:20px}
  .sc-row,.sc-ends{grid-template-columns:1fr 50px}.sc-row .sc-lab,.sc-ends div:first-child{grid-column:1/-1}
  .sc-ends div:last-child{display:none}
  .rk-row{grid-template-columns:40px 1fr}.rk-row .rk-bar{grid-column:2}
  .pv-top{padding:12px}.join-banner .codebig{font-size:22px}
}

/* ---------- Joined mentees · name entry · motion polish ---------- */
#app>*{animation:viewIn .55s var(--spring) backwards}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}}
.btn{position:relative;overflow:hidden;isolation:isolate}
.btn.primary::after,.btn.mint::after,.btn.pink::after,.btn.navy::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s ease;z-index:-1;pointer-events:none}
.btn.primary:hover::after,.btn.mint:hover::after,.btn.pink:hover::after,.btn.navy:hover::after{transform:translateX(120%)}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none;z-index:-1}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.modal-bg.out{animation:fadeOut .22s forwards}
.modal-bg.out .modal{animation:modalOut .22s forwards}
@keyframes fadeOut{to{opacity:0}}
@keyframes modalOut{to{opacity:0;transform:translateY(16px) scale(.96)}}
.pv-stage .stage-anim{animation:stageIn .65s var(--spring) backwards}
@keyframes stageIn{from{opacity:0;transform:translateY(28px) scale(.97);filter:blur(8px)}}
.aud-card{animation:cardIn .6s var(--spring) backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96) rotate(-.6deg);filter:blur(4px)}}
.bump{animation:bump .45s var(--spring)}
@keyframes bump{40%{transform:scale(1.35);color:var(--orange)}}
.q-title{animation:rise .6s .08s var(--spring) both}
.opt{animation:rise .5s var(--spring) backwards}
.opt:nth-child(1){animation-delay:.08s}.opt:nth-child(2){animation-delay:.14s}.opt:nth-child(3){animation-delay:.2s}.opt:nth-child(4){animation-delay:.26s}.opt:nth-child(5){animation-delay:.32s}.opt:nth-child(n+6){animation-delay:.38s}
.opt:active{transform:scale(.98)}

/* Ask-names switch */
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:14px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .sw{width:46px;height:26px;border-radius:99px;background:#E2E3F3;border:1.5px solid var(--edge);position:relative;flex:none;transition:background .25s}
.switch .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;border:1.5px solid var(--edge);transition:transform .3s var(--spring)}
.switch input:checked+.sw{background:var(--mint)}
.switch input:checked+.sw::after{transform:translateX(20px)}
.switch input:focus-visible+.sw{box-shadow:0 0 0 4px rgba(109,93,252,.25)}
.switch small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.switch.star input:checked+.sw{background:var(--yellow)}
.org-chip{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 16px;border-radius:99px;background:var(--yellow);border:1.5px solid var(--edge);box-shadow:var(--sh-sm);font-family:var(--fd);font-weight:600;font-size:clamp(16px,1.8vw,22px);max-width:100%;word-break:break-word}
.wel-card .org-chip{font-size:15px}
.ses-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;margin:6px 0 16px}
.ses-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid #DCDCF0;border-radius:14px;background:#FAFAFF}
.ses-row .sn{flex:1;min-width:0}.ses-row .sn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ses-row .sn small{color:var(--muted);font-weight:700}
.set-box{padding:14px 16px;border:2px dashed #DCDCF0;border-radius:16px;background:#FAFAFF;margin-bottom:18px}
.ed-top .switch{padding:6px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:13px}
.thumb.name-thumb{cursor:default;background:linear-gradient(135deg,#E9FBF4,#FFF6E0);border-style:dashed;animation:rise .4s var(--spring) both}
.thumb.name-thumb small{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:2px}

/* Avatars */
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--fd);font-weight:600;font-size:15px;border:1.5px solid var(--edge);flex:none;text-transform:uppercase}

/* Name-entry slide (mentee) */
.name-card{text-align:center;padding:34px 24px;position:relative;overflow:hidden}
.name-card::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(109,93,252,.18),transparent 70%);top:-120px;right:-90px;animation:drift 8s ease-in-out infinite alternate}
.name-card::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.15),transparent 70%);bottom:-110px;left:-80px;animation:drift 9s ease-in-out infinite alternate-reverse}
.name-card>*{position:relative;z-index:1}
.name-step{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);animation:rise .5s var(--spring) both}
.name-step i{width:8px;height:8px;border-radius:50%;background:#E2E3F3}.name-step i.on{background:var(--orange);width:20px;border-radius:9px}
.name-av{width:96px;height:96px;margin:18px auto 8px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:38px;color:#fff;border:2px solid var(--edge);box-shadow:var(--sh);transition:background .35s;animation:popIn .6s .1s var(--spring) both;position:relative}
.name-av::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px dashed var(--orange);animation:spin 12s linear infinite;opacity:.6}
.name-av.typing{animation:wiggle .35s}
@keyframes wiggle{30%{transform:rotate(-6deg) scale(1.05)}60%{transform:rotate(5deg)}}
.name-card h2{font-size:30px;margin:10px 0 6px;animation:rise .55s .15s var(--spring) both}
.name-card p{animation:rise .55s .22s var(--spring) both}
.name-card .input{font-size:19px;padding:15px;text-align:center;animation:rise .55s .3s var(--spring) both}
.name-card .submit{animation:rise .55s .38s var(--spring) both}
.name-hi{font-family:var(--fd);font-size:20px;font-weight:600;color:var(--orange);min-height:26px;margin-bottom:6px;transition:opacity .2s}
.you-are{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:6px 12px 6px 6px;border-radius:99px;background:#fff;border:1.5px solid var(--edge);box-shadow:var(--sh-sm);font-weight:800;font-size:14px;animation:popIn .5s .5s var(--spring) both}
.you-are .av{width:28px;height:28px;font-size:12px}
.you-are button{color:var(--orange);font-weight:900;text-decoration:underline;font-size:12.5px;margin-left:2px}

/* Confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:3px;animation:confFall var(--d) cubic-bezier(.25,.6,.4,1) forwards}
@keyframes confFall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.8}}

/* Who-joined button on the presenter welcome slide */
.wel-joined{margin-top:24px;display:inline-flex;align-items:center;gap:12px;padding:8px 18px 8px 10px;border-radius:99px;background:#fff;border:2px solid var(--edge);box-shadow:var(--sh);font-weight:900;font-size:17px;cursor:pointer;transition:transform .25s var(--spring),box-shadow .25s;animation:rise .6s .6s var(--spring) both;position:relative;z-index:2}
.wel-joined:hover{transform:translateY(-3px) scale(1.03);box-shadow:var(--sh-lg)}
.wel-joined:active{transform:translateY(1px) scale(.98);box-shadow:var(--sh-sm)}
.wel-joined .stack{display:flex}
.wel-joined .stack .av{width:34px;height:34px;font-size:13px;margin-left:-10px;animation:popIn .45s var(--spring) both}
.wel-joined .stack .av:first-child{margin-left:0}
.wel-joined .stack .av.more{background:var(--grad-pri)}
.wel-joined .ico{width:34px;height:34px;border-radius:50%;background:var(--mint);display:grid;place-items:center;color:#fff;border:1.5px solid var(--edge);font-size:16px}
.wel-joined b{font-family:var(--fd);font-size:24px;color:var(--orange)}
.wel-joined.ping{animation:joinPing .9s var(--spring)}
@keyframes joinPing{0%{box-shadow:var(--sh)}30%{transform:scale(1.07);box-shadow:0 0 0 10px rgba(25,199,154,.35),var(--sh)}100%{box-shadow:var(--sh)}}
.bar-joined b{font-family:var(--fd);margin-left:2px}

/* Who-joined popup */
.jn-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:6px}
.jn-count{font-family:var(--fd);font-weight:700;font-size:54px;line-height:1;color:var(--orange);text-align:right}
.jn-count small{display:block;font-family:var(--fb);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.jn-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 16px}
.jn-tools .input{flex:1;min-width:160px;padding:9px 13px;font-size:14px}
.jn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;max-height:52vh;overflow:auto;padding:4px 6px 10px 2px}
.jn-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid var(--edge);border-radius:14px;background:#fff;box-shadow:var(--sh-sm);font-weight:800;animation:rise .4s var(--spring) both;min-width:0}
.jn-tx{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.2}
.jn-tx b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jn-tx small{font-size:11px;color:var(--muted);font-weight:800}
.jn-item.new{animation:jnNew .8s var(--spring) both}
@keyframes jnNew{0%{opacity:0;transform:scale(.5)}60%{background:#E9FBF4;transform:scale(1.06)}100%{background:#fff}}
.jn-empty{text-align:center;padding:34px 10px;color:var(--muted);font-weight:800}
.jn-empty .em{font-size:52px;display:block;margin-bottom:8px;animation:bob 1.8s ease-in-out infinite}
.jn-anon{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--soft);font-weight:700;margin-bottom:14px}
.jn-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
/* ---------- Points + final leaderboard ---------- */
.ff-mark small{display:block;font-size:12px;font-weight:900;color:var(--mint);line-height:1}
.fl-sub{font-weight:800;color:var(--muted);margin:-10px 0 10px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end;border-bottom:2px solid var(--edge);padding:0 8px;width:min(760px,100%);margin:10px auto 22px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;animation:podUp .8s var(--spring) backwards;min-width:0}
@keyframes podUp{from{opacity:0;transform:translateY(60px) scale(.9)}}
.pod .av{width:58px;height:58px;font-size:22px;box-shadow:var(--sh-sm);margin-bottom:6px}
.pod1 .av{width:76px;height:76px;font-size:28px;animation:bob 2.2s ease-in-out infinite}
.pod-name{font-family:var(--fd);font-weight:600;font-size:clamp(16px,1.8vw,22px);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-pts{font-weight:800;color:var(--muted);margin-bottom:8px}.pod-pts b{font-family:var(--fd);font-size:26px;color:var(--orange)}
.pod-step{width:100%;border:2px solid var(--edge);border-bottom:none;border-radius:16px 16px 0 0;display:grid;place-items:start center;padding-top:10px;font-size:38px;box-shadow:none}
.pod1 .pod-step{height:150px;background:linear-gradient(180deg,#FFE27A,#FFB020)}
.pod2 .pod-step{height:110px;background:linear-gradient(180deg,#EEF1F8,#C9D1E3)}
.pod3 .pod-step{height:80px;background:linear-gradient(180deg,#FFD9B8,#E8A06A)}
.pod.me .pod-name{color:var(--orange)}
.fl-list{display:flex;flex-direction:column;gap:8px;width:min(760px,100%);margin:0 auto;max-height:34vh;overflow:auto;padding:2px 6px 8px 2px}
.fl-row{display:grid;grid-template-columns:36px 38px 1fr auto 80px;gap:12px;align-items:center;padding:9px 14px;border:1.5px solid var(--edge);border-radius:14px;background:#fff;box-shadow:var(--sh-sm);animation:rise .5s var(--spring) backwards}
.fl-row.me{outline:3px solid var(--orange);outline-offset:2px}
.fl-rank{font-family:var(--fd);font-weight:600;font-size:18px;text-align:center}
.fl-name{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl-meta{font-size:12.5px;font-weight:800;color:var(--muted)}
.fl-pts{text-align:right;font-weight:800;color:var(--muted)}.fl-pts b{font-family:var(--fd);font-size:22px;color:var(--orange)}
.aud-card .podium{gap:8px}.aud-card .pod .av{width:44px;height:44px;font-size:17px}.aud-card .pod1 .av{width:54px;height:54px}
.aud-card .pod1 .pod-step{height:100px}.aud-card .pod2 .pod-step{height:74px}.aud-card .pod3 .pod-step{height:54px}.aud-card .pod-step{font-size:28px}
.aud-card .fl-row{grid-template-columns:26px 32px 1fr 58px;gap:8px;padding:8px 10px}.aud-card .fl-row .av{width:32px;height:32px;font-size:12px}.aud-card .fl-meta{display:none}
/* ---------- Scenario ---------- */
.sec-in{display:flex;align-items:center;gap:8px}.sec-in .input{flex:1}.sec-in span{font-weight:900;color:var(--muted)}
.q-tabs{display:flex;flex-wrap:wrap;gap:6px}
.q-tab{padding:7px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:13px;transition:all .2s var(--spring)}
.q-tab:hover{border-color:#0CA678;transform:translateY(-2px)}
.q-tab.on{background:#0CA678;color:#fff;border-color:var(--orange);box-shadow:var(--sh-sm)}
.q-tab.add{border-style:dashed;color:#0CA678}
.q-box{padding:14px;border:2px solid #0CA678;border-radius:16px;background:#F3FCF8;margin-bottom:12px;animation:rise .35s var(--spring) backwards}
.q-box-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-family:var(--fd);font-size:17px}
.sc-read{display:flex;flex-direction:column;gap:16px;width:min(1000px,100%);margin:0 auto;animation:rise .6s var(--spring) backwards}
.sc-clock{display:flex;align-items:center;gap:12px}
.sc-clock .ff-track{margin:0;flex:1;height:14px}
.sc-clock b{font-family:var(--fd);font-size:28px;font-weight:700;color:var(--mint);min-width:62px;text-align:right}
.sc-clock b.low{color:var(--pink);animation:ffPulse 1s infinite}
.sc-lbl{font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sc-para{padding:24px 28px;border-radius:22px;background:#fff;border:2px solid var(--edge);box-shadow:var(--sh);font-size:clamp(19px,1.9vw,27px);font-weight:700;line-height:1.6;max-height:56vh;overflow:auto;text-align:left;position:relative;transition:opacity .5s,filter .5s,transform .5s}
.tx-card{align-self:center;width:min(1100px,100%);padding:30px 38px;border-radius:24px;background:#fff;border:2px solid var(--edge);box-shadow:var(--sh);text-align:left;max-height:62vh;overflow:auto}
.tx-card h1{font-size:clamp(28px,3.2vw,46px);margin-bottom:16px}
.tx-body{font-size:clamp(20px,2vw,30px);font-weight:700;line-height:1.55}.tx-body.long{font-size:clamp(16px,1.5vw,22px)}
.tx-body p+p{margin-top:.8em}.tx-body p{animation:rise .6s var(--spring) backwards}
.tx-body p:nth-child(2){animation-delay:.12s}.tx-body p:nth-child(n+3){animation-delay:.24s}
.tx-slide{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%}
.tx-slide .wel-hi{display:none}
.tx-slide .wel-logo{height:clamp(48px,7vh,76px)}
.tx-slide .wel-app{font-size:clamp(32px,4vw,58px);margin-top:8px}
.tx-slide .wel-by{font-size:clamp(10px,.9vw,12px)}
.tx-slide .wel-title{margin-top:14px;font-size:clamp(18px,1.9vw,26px);padding:8px 22px}
.tx-slide .tx-card{margin-top:24px;max-height:46vh}
.pv-stage .tx-wrap{flex:1;display:flex;align-items:center;justify-content:center}
.aud-card .tx-card{box-shadow:none;border:0;border-top:2px dashed var(--line);border-radius:0;padding:18px 0 0;max-height:none;overflow:visible}
.aud-card .tx-slide .wel-logo{height:52px}.aud-card .tx-slide .wel-app{font-size:clamp(30px,9.5vw,44px)}.aud-card .tx-slide .wel-title{font-size:18px;padding:8px 16px}
.aud-card .tx-card h1{font-size:clamp(24px,6.5vw,32px);margin:6px 0 14px}.aud-card .tx-body{font-size:18px}
.sc-para.long{font-size:clamp(16px,1.45vw,21px)}
.sc-para p+p{margin-top:.8em}
.sc-para p{animation:rise .6s var(--spring) backwards}
.sc-para p:nth-child(2){animation-delay:.12s}.sc-para p:nth-child(3){animation-delay:.24s}.sc-para p:nth-child(n+4){animation-delay:.36s}
.sc-para.sc-m{font-size:16.5px;padding:18px;box-shadow:var(--sh);max-height:none}
.sc-para.gone{opacity:0;filter:blur(10px);transform:scale(.97)}
.sc-note{text-align:center;font-weight:800;color:var(--muted)}
.sc-look{margin:18px auto 0;width:min(1000px,100%)}
.sc-look summary{cursor:pointer;font-weight:900;color:var(--muted);text-align:center;list-style:none;padding:8px}
.sc-look summary:hover{color:var(--orange)}
.sc-look .sc-para{margin-top:8px;max-height:40vh}
.q-title.swap{animation:titleSwap .6s var(--spring)}
@keyframes titleSwap{0%{opacity:0;transform:translateY(-14px) scale(.97);filter:blur(6px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ---------- Image Question: picture grid + zoom viewer ---------- */
.ig-grid{display:grid;gap:10px;margin:0 auto 18px;max-width:900px;grid-template-columns:repeat(var(--c,1),1fr)}
.ig-grid.n1{--c:1}.ig-grid.n2{--c:2}.ig-grid.n3{--c:3}.ig-grid.n4{--c:2}.ig-grid.n5,.ig-grid.n6{--c:3}
.ig-cell{position:relative;padding:0;border:2px solid var(--edge);border-radius:16px;overflow:hidden;background:#fff;cursor:zoom-in;box-shadow:var(--sh-sm);display:block;width:100%}
.ig-cell img{display:block;width:100%;height:100%;max-height:var(--h,34vh);object-fit:contain;background:#fff}
.ig-grid:not(.n1) .ig-cell img{height:var(--hh,22vh);object-fit:cover}
.ig-cell .ig-n{position:absolute;top:6px;left:6px;background:var(--yellow);border:1.5px solid var(--edge);border-radius:99px;font-weight:900;font-size:13px;min-width:26px;height:26px;display:grid;place-items:center;padding:0 6px}
.ig-cell .ig-z{position:absolute;right:6px;bottom:6px;background:rgba(36,38,77,.82);color:#fff;border-radius:99px;font-weight:800;font-size:12px;padding:4px 10px}
.ig-cell:hover{transform:translateY(-2px)}
.aud-card .ig-grid{--h:38vh;--hh:16vh;gap:8px;margin-bottom:14px}
.aud-card .ig-grid.n3,.aud-card .ig-grid.n5,.aud-card .ig-grid.n6{--c:2}
.ig-empty{padding:30px;border:3px dashed #DCDCF0;border-radius:16px;text-align:center;font-weight:800;color:var(--muted);margin-bottom:16px}
.ig-ed{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.ig-ed div{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:1}
.ig-ed img{width:100%;height:100%;object-fit:cover;display:block}
.ig-ed b{position:absolute;top:4px;left:4px;background:var(--yellow);border-radius:99px;font-size:11px;padding:0 6px;border:1.5px solid var(--edge)}
.ig-ed button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--edge);background:#fff;font-weight:900;cursor:pointer;line-height:1}
.zv{position:fixed;inset:0;z-index:9999;background:rgba(10,14,40,.97);display:flex;flex-direction:column;touch-action:none;animation:rise .2s both}
.zv-top{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;font-weight:800}
.zv-top .sp{flex:1}
.zv button{background:#fff;color:var(--navy);border:1.5px solid var(--edge);border-radius:12px;font-weight:900;font-size:18px;min-width:44px;height:44px;cursor:pointer;padding:0 10px}
.zv-stage{flex:1;overflow:hidden;position:relative;cursor:grab}
.zv-stage.drag{cursor:grabbing}
.zv-stage img{position:absolute;left:50%;top:50%;max-width:96%;max-height:96%;transform-origin:center;user-select:none;-webkit-user-drag:none;background:#fff;border-radius:8px}
.zv-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2}
.zv-nav.l{left:10px}.zv-nav.r{right:10px}
.zv-hint{color:#C9D2FF;text-align:center;font-weight:700;font-size:13px;padding:8px}
.ig-tally{display:flex;flex-direction:column;gap:8px;width:100%;max-width:820px;margin:0 auto}
.ig-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px;border:1.5px solid var(--edge);border-radius:14px;background:#fff;position:relative;overflow:hidden;font-weight:800}
.ig-row i{position:absolute;inset:0 auto 0 0;background:#E8EDFF;z-index:0;transition:width .6s var(--spring)}
.ig-row.ok i{background:#CFF5E6}
.ig-row span,.ig-row b{position:relative;z-index:1;word-break:break-word}

/* =================== REDESIGN LAYER =================== */
/* ---------- Tokens: bright, light palette ---------- */
@property --p{syntax:'<number>';inherits:false;initial-value:100}
:root{
  --fd:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
  --fb:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --navy:#24264D;--navy2:#33366B;--ink:#24264D;--muted:#6F7396;
  --orange:#6D5DFC;--amber:#FFB547;--pink:#FF4D8D;--mint:#14C9A1;--sky:#38AEFF;--violet:#B455F5;--yellow:#FFE45C;
  --bg:#F7F7FF;--card:#FFFFFF;--line:#ECECF8;--soft:#F2F0FF;--edge:#E4E4F4;
  --grad-pri:linear-gradient(135deg,#7C6CFF 0%,#5D7BFF 100%);
  --grad-hot:linear-gradient(135deg,#8B5CFF 0%,#D04BEB 55%,#FF4D8D 100%);
  --grad-cool:linear-gradient(135deg,#14C9A1 0%,#38AEFF 100%);
  --grad-sun:linear-gradient(135deg,#FFE45C 0%,#FFB547 100%);
  --grad-title:linear-gradient(90deg,#6D5DFC 0%,#A855F7 22%,#FF4D8D 46%,#FF8A3D 66%,#14C9A1 86%,#38AEFF 100%);
  --r:22px;
  --sh-sm:0 1px 2px rgba(56,52,140,.05),0 6px 16px -6px rgba(56,52,140,.16);
  --sh:0 2px 6px rgba(56,52,140,.05),0 18px 40px -18px rgba(56,52,140,.28);
  --sh-lg:0 4px 12px rgba(56,52,140,.06),0 34px 70px -26px rgba(56,52,140,.38);
  --sh-pri:0 10px 24px -10px rgba(109,93,252,.7);
  --spring:cubic-bezier(.2,.9,.3,1.2);
  --ease:cubic-bezier(.22,1,.36,1);
}
html{background:var(--bg);overflow-x:clip}
body{font-family:var(--fb);color:var(--ink);background:var(--bg);font-weight:500;letter-spacing:-.003em}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(80px);opacity:.55}
body::before{width:46vmax;height:46vmax;left:-14vmax;top:-16vmax;background:radial-gradient(circle,#DCD5FF 0%,transparent 65%);animation:bgDrift 22s ease-in-out infinite alternate}
body::after{width:42vmax;height:42vmax;right:-14vmax;bottom:-16vmax;background:radial-gradient(circle,#CDEFFF 0%,transparent 65%);animation:bgDrift 26s -8s ease-in-out infinite alternate-reverse}
@keyframes bgDrift{to{transform:translate(6vmax,5vmax) scale(1.15)}}
h1,h2,h3,h4,.display{font-family:var(--fd);font-weight:700;letter-spacing:-.025em;line-height:1.08}
::selection{background:#E3DDFF;color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:#D5D3F0 transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#D9D7F2;border-radius:99px;border:3px solid transparent;background-clip:padding-box}
:focus-visible{outline:3px solid rgba(109,93,252,.45);outline-offset:2px}

/* ---------- Buttons ---------- */
.btn{border:1.5px solid var(--edge);border-radius:14px;font-weight:700;font-size:15px;background:#fff;box-shadow:var(--sh-sm);letter-spacing:-.005em;
  transition:transform .25s var(--spring),box-shadow .25s var(--ease),background .25s,border-color .25s,color .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:#D6D4F3}
.btn:active{transform:translateY(0) scale(.97);box-shadow:var(--sh-sm)}
.btn.primary,.btn.navy{background:var(--grad-pri);color:#fff;border-color:transparent;box-shadow:var(--sh-pri)}
.btn.primary:hover,.btn.navy:hover{box-shadow:0 16px 30px -12px rgba(109,93,252,.75);border-color:transparent}
.btn.mint{background:var(--grad-cool);color:#fff;border-color:transparent;box-shadow:0 10px 24px -10px rgba(20,201,161,.7)}
.btn.pink{background:linear-gradient(135deg,#FF6B9E,#FF4D6D);color:#fff;border-color:transparent;box-shadow:0 10px 24px -10px rgba(255,77,141,.7)}
.btn.yellow,.btn.on{background:var(--grad-sun);color:var(--ink);border-color:transparent;box-shadow:0 10px 24px -12px rgba(255,181,71,.8)}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn.ghost:hover{background:var(--soft);transform:none;box-shadow:none;color:var(--orange)}
.btn.sm{border-radius:12px;font-size:13.5px}
.btn.yellow::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s ease;z-index:-1;pointer-events:none}
.btn.yellow:hover::after{transform:translateX(120%)}
.card{border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--sh);background:#fff}
.input{border:1.5px solid var(--edge);border-radius:13px;font-weight:600;background:#fff;transition:border-color .2s,box-shadow .25s,background .2s}
.input:hover{border-color:#D3D1F0}
.input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(109,93,252,.14)}
.field>label,.lbl{font-weight:800;letter-spacing:.08em;font-size:11px}
.tag{border:1.5px solid var(--edge);font-weight:800;background:#fff;box-shadow:var(--sh-sm)}
.chk input{accent-color:var(--orange)}
.hint{background:linear-gradient(135deg,#F4F2FF,#EEF7FF);border:1px solid #E7E5FA;border-radius:14px}

/* ---------- Brand ---------- */
.brand-sub{font-family:var(--fd);font-weight:800;font-size:26px;letter-spacing:-.03em;padding-left:14px;border-left:2px solid var(--edge);
  background:var(--grad-title);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
.brand.light{background:#fff;border:1px solid var(--edge);box-shadow:var(--sh-sm)}
.brand-logo{transition:transform .35s var(--spring)}

/* ---------- Big animated title (letters) ---------- */
.tl-wrap{display:inline-block;white-space:nowrap;filter:drop-shadow(0 10px 22px rgba(109,93,252,.22))}
.tl{display:inline-block;background:var(--grad-title);background-size:calc((var(--n) + 1) * 100%) 100%;background-position:calc(var(--i) / var(--n) * 100%) 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-bottom:.08em;
  animation:tlIn .9s calc(var(--i) * 48ms + .08s) var(--spring) both,tlWave 7s calc(var(--i) * 70ms + 2s) ease-in-out infinite;
  transition:translate .35s var(--spring),scale .35s var(--spring)}
.tl:hover{translate:0 -.12em;scale:1.08}
