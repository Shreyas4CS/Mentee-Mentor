@keyframes tlIn{0%{opacity:0;transform:translateY(.55em) rotate(10deg) scale(.6);filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes tlWave{0%,8%,100%{transform:none}4%{transform:translateY(-.1em) rotate(-3deg)}}
.bigname,.wel-app{background:none!important;-webkit-text-fill-color:initial;color:var(--ink);animation:none!important}
.bigname{font-family:var(--fd);font-weight:800;font-size:clamp(54px,8vw,124px);letter-spacing:-.045em;line-height:.95;margin:20px 0 18px;white-space:nowrap}
.bigname small{font-family:var(--fb);font-weight:800;font-size:clamp(11px,1.05vw,14px);letter-spacing:.32em;margin-top:14px;color:var(--muted);-webkit-text-fill-color:var(--muted);animation:rise .8s .7s var(--ease) both}
@media (max-width:1000px){.hero .wrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.bigname{font-size:clamp(36px,11vw,60px)}}

/* ---------- Toasts / modal ---------- */
.toast{background:rgba(36,38,77,.92);backdrop-filter:blur(10px);border-radius:16px;font-weight:700;box-shadow:0 18px 40px -14px rgba(36,38,77,.5)}
.toast.ok{background:linear-gradient(135deg,#14C9A1,#12B48F)}.toast.err{background:linear-gradient(135deg,#FF6B9E,#FF4D6D)}
.modal-bg{background:rgba(40,38,90,.28);backdrop-filter:blur(10px) saturate(140%)}
.modal{border-radius:28px;border:1px solid rgba(255,255,255,.7);box-shadow:var(--sh-lg)}
.modal h3{font-size:28px}

/* ---------- Landing ---------- */
.nav{background:rgba(247,247,255,.72);backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid transparent}
.nav.scrolled{border-color:var(--edge);box-shadow:0 10px 30px -24px rgba(56,52,140,.5)}
.nav-links a{font-weight:700;border-radius:12px;position:relative}
.nav-links a::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;border-radius:2px;background:var(--grad-hot);transform:scaleX(0);transition:transform .35s var(--ease)}
.nav-links a:hover{background:transparent;color:var(--orange)}.nav-links a:hover::after{transform:scaleX(1)}
.hero{padding:56px 0 96px}
@media (min-width:1001px){.hero .wrap{grid-template-columns:1.08fr .92fr}.phone{left:0}.screen{right:-44px;top:96px;width:260px}.cloud-card{right:-24px;bottom:18px;width:236px}.chip-live{left:-40px;top:300px}}
.blob{opacity:.7;filter:blur(70px)}
.pill{border:1px solid var(--edge);box-shadow:var(--sh-sm);font-weight:700;background:rgba(255,255,255,.85);backdrop-filter:blur(8px)}
.pill i{background:var(--grad-hot);animation:spinSlow 6s linear infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.hero h1{font-size:clamp(26px,3vw,40px);font-weight:700;color:var(--ink);letter-spacing:-.03em;animation:rise .8s .45s var(--ease) both}
.hl{color:var(--orange);background:var(--grad-hot);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p.lead{font-size:18.5px;font-weight:500;color:var(--muted);animation:rise .8s .55s var(--ease) both}
.modes{animation:rise .8s .65s var(--ease) both}
.mode-btn{border:none;border-radius:26px;box-shadow:var(--sh);transition:transform .35s var(--spring),box-shadow .35s var(--ease);isolation:isolate}
.mode-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .9s var(--ease);z-index:-1}
.mode-btn:hover::before{transform:translateX(120%)}
.mode-btn:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:var(--sh-lg)}
.mode-btn:active{transform:translateY(-1px) scale(.98)}
.mode-btn.p{background:var(--grad-hot);box-shadow:0 22px 44px -20px rgba(170,80,240,.75)}
.mode-btn.u{background:var(--grad-cool);box-shadow:0 22px 44px -20px rgba(20,170,190,.7)}
.mode-btn .mi{background:rgba(255,255,255,.24);border-radius:16px;backdrop-filter:blur(4px);transition:transform .4s var(--spring)}
.mode-btn:hover .mi{transform:rotate(-8deg) scale(1.08)}
.mode-btn h3{font-size:25px;font-weight:700}
.quick{animation:rise .8s .75s var(--ease) both;font-weight:700}
.phone{border:1px solid var(--edge);box-shadow:var(--sh-lg);border-radius:40px;background:linear-gradient(180deg,#fff,#FAF9FF)}
.phone::before{background:#E6E5F6}
.phone .q{font-family:var(--fd);font-weight:700}
.phone .opt-demo{border:1.5px solid var(--edge);border-radius:14px;font-weight:700}
.phone .opt-demo.sel{border-color:var(--pink);background:#FFF0F6}
@keyframes pulseSel{0%,30%{border-color:var(--edge);background:#fff}40%,100%{border-color:var(--pink);background:#FFF0F6}}
.phone .send{background:var(--grad-pri);box-shadow:var(--sh-pri)}
.bars-demo{border-bottom:2px solid var(--edge)}
.bars-demo div{border-radius:10px 10px 4px 4px}
.chip-live{border-radius:99px}
.marquee{background:var(--grad-title);background-size:200% auto;animation:shine 12s linear infinite;border:none;box-shadow:0 18px 40px -22px rgba(109,93,252,.6)}
.marquee-in span{font-family:var(--fd);font-weight:600;font-size:21px;letter-spacing:-.01em}
.marquee .ticon{color:#fff!important;opacity:.95}
.eyebrow{font-weight:800;color:var(--orange);background:#EFECFF;padding:7px 14px;border-radius:99px;letter-spacing:.12em;font-size:12px}
.sec-head h2{font-weight:800;letter-spacing:-.035em}
.sec-head p{font-weight:500}
.type-card{border-radius:24px;transition:transform .45s var(--spring),box-shadow .35s var(--ease),border-color .3s}
.type-card:hover{transform:translateY(-8px) rotate(-.6deg);box-shadow:var(--sh-lg);border-color:#DCD8FA}
.type-card .ti{border:none;border-radius:18px;transition:transform .45s var(--spring)}
.type-card:hover .ti{transform:rotate(-10deg) scale(1.12)}
.type-card h4{font-weight:700}
.type-card p,.step p{font-weight:500}
.reveal{filter:blur(6px);transition:opacity .8s var(--ease),transform .8s var(--ease),filter .8s var(--ease)}
.reveal.in{filter:none}
#how{background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(244,242,255,.75))!important;border-color:var(--edge)!important}
.step{border-radius:24px;transition:transform .45s var(--spring),box-shadow .35s}
.step:hover{transform:translateY(-6px);box-shadow:var(--sh-lg)}
.step .n{border:none;border-radius:18px;font-family:var(--fd);font-weight:800;box-shadow:var(--sh-sm)}
.step:nth-child(1) .n{background:var(--grad-hot)!important}.step:nth-child(2) .n{background:linear-gradient(135deg,#38AEFF,#5D7BFF)!important}.step:nth-child(3) .n{background:var(--grad-cool)!important}
.feat{border:1px solid rgba(255,255,255,.8);border-radius:24px;box-shadow:var(--sh-sm);transition:transform .45s var(--spring),box-shadow .35s}
.feat:hover{transform:translateY(-6px);box-shadow:var(--sh)}
.feat .fi{display:inline-block;transition:transform .5s var(--spring)}
.feat:hover .fi{transform:scale(1.25) rotate(-10deg)}
.feat p{font-weight:500;opacity:.8}
.cta{background:var(--grad-hot);border:none;box-shadow:0 30px 60px -28px rgba(170,80,240,.8);border-radius:34px}
.cta::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14);left:-60px;bottom:-110px;animation:drift 9s ease-in-out infinite alternate}
.cta h2{font-weight:800;letter-spacing:-.035em;position:relative;z-index:1}
.cta .row{position:relative;z-index:1}
.cta .btn:not(.yellow){color:var(--ink);background:#fff;border-color:transparent}
footer.foot{background:linear-gradient(180deg,#F1EEFF 0%,#EAF5FF 100%);color:var(--muted);border-top:1px solid var(--edge)}
.foot h5{font-family:var(--fd);color:var(--ink);font-weight:700}
.foot ul{font-weight:600}.foot ul a:hover{color:var(--orange)}
.foot-bottom{border-top:1px solid rgba(36,38,77,.08);font-weight:600}
.foot-wave{opacity:.06}
.mini-foot{font-weight:600}
.mini-foot b{background:var(--grad-hot);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* ---------- Presenter dashboard ---------- */
.topbar,.ed-top{background:rgba(255,255,255,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--edge)}
.dash-head h1{font-size:46px;font-weight:800;letter-spacing:-.035em}
.pcard{border-radius:24px}
.pcard:hover{transform:translateY(-6px);box-shadow:var(--sh-lg)}
.pcard .cover{border-bottom:none;height:124px;position:relative;overflow:hidden}
.pcard .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-100%);transition:transform .9s var(--ease)}
.pcard:hover .cover::after{transform:translateX(100%)}
.pcard .cover .ticon{filter:drop-shadow(0 4px 8px rgba(36,38,77,.2));transition:transform .4s var(--spring)}
.pcard:hover .cover .ticon{transform:translateY(-4px) rotate(-6deg)}
.pcard .code{border:none;border-radius:12px;box-shadow:var(--sh-sm);font-weight:800}
.pcard h3{font-weight:700}
.pcard .meta{font-weight:600}
.new-card{border:2px dashed #D3D0F2;border-radius:24px;font-family:var(--fd);background:rgba(255,255,255,.5)}
.new-card:hover{border-color:var(--orange);color:var(--orange);background:#F4F2FF}
.new-card .plus{background:var(--grad-hot);border:none;box-shadow:var(--sh-pri);border-radius:22px}
.lock-ico{background:var(--grad-hot);border:none;box-shadow:var(--sh-pri);animation:popIn .7s var(--spring) both}

/* ---------- Editor ---------- */
.ed-side,.ed-panel{background:rgba(255,255,255,.85);border-color:var(--edge)}
.thumb{border:1.5px solid var(--edge);border-radius:16px;transition:all .25s var(--ease)}
.thumb:hover{border-color:#D3D1F0;transform:translateX(2px)}
.thumb.sel{border-color:var(--orange);background:#F6F4FF;box-shadow:0 8px 20px -12px rgba(109,93,252,.6)}
.add-slide{border:2px dashed #D3D0F2;border-radius:16px;font-weight:800}
.add-slide:hover{border-color:var(--orange);color:var(--orange);background:#F4F2FF}
.ed-main{background:radial-gradient(#DCDCF2 1.2px,transparent 1.2px) 0 0/22px 22px,transparent}
.canvas{border-radius:26px}
.type-pick button{border:1.5px solid var(--edge);border-radius:18px;font-weight:700}
.type-pick button:hover{border-color:var(--orange);transform:translateY(-3px);box-shadow:var(--sh)}
.list-row .x:hover{background:#FFE8F0}
.add-link{font-weight:800}

/* ---------- Slide stage ---------- */
.q-chip{font-weight:800;color:var(--muted);background:rgba(255,255,255,.85);padding:7px 14px 7px 10px;border-radius:99px;border:1px solid var(--edge);box-shadow:var(--sh-sm);align-self:flex-start;animation:rise .6s var(--ease) both}
.q-title{font-weight:800;letter-spacing:-.035em}
.empty-res{font-weight:700}
.mc-track{border-bottom:2px solid var(--edge)}
.mc-fill{border:none;border-radius:16px 16px 6px 6px;position:relative;box-shadow:0 -6px 20px -10px rgba(36,38,77,.25)}
.mc-fill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 55%)}
.mc-val b{font-family:var(--fd);font-weight:800}
.mc-lab{font-weight:700}
.wc-w{font-family:var(--fd);font-weight:700;letter-spacing:-.02em}
.wc-w.top{text-shadow:0 8px 24px rgba(109,93,252,.25)}
.wc-n{border:none;box-shadow:var(--sh-sm)}
.oe-card{border:1px solid var(--edge);border-radius:20px;font-weight:600}
.sc-track{background:#EEEEF9}
.sc-dot{border:3px solid #fff;box-shadow:0 4px 12px rgba(36,38,77,.25)}
.sc-avg,.gs-stats b,.qa-up b,.jn-count,.pod-pts b,.fl-pts b,.big-num,.ff-me b,.bz-pos{font-family:var(--fd);font-weight:800}
.pt-bar,.rk-bar{border:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.rk-n,.ff-rank{border-radius:14px;font-family:var(--fd);font-weight:700}
.ff-rank.m{background:none}
.qa-item{border:1px solid var(--edge);border-radius:20px;transition:transform .3s var(--spring)}
.qa-item:hover{transform:translateY(-2px)}
.gs-bar{border:none;background:linear-gradient(#FFB4D0,var(--pink))}
.gs-bar.z{background:#EEEEF9}
.gs-axis{font-weight:800}
.gs-mark{border-left:3px dashed var(--orange)}
.gr-box{border:2px solid var(--edge);border-radius:20px;background:linear-gradient(#C9CAE6,#C9CAE6) center/2px 100% no-repeat,linear-gradient(#C9CAE6,#C9CAE6) center/100% 2px no-repeat,linear-gradient(135deg,#F3F0FF 0 50%,#EAF6FF 50%)}
.gr-avg{border:3px solid #fff;box-shadow:0 4px 12px rgba(36,38,77,.25)}
.gr-avg span{border:1px solid var(--edge);box-shadow:var(--sh-sm)}
.fm-table{border:1px solid var(--edge);border-radius:16px}
.pin-wrap{border:2px solid var(--edge);border-radius:20px}
.pin-dot{background:var(--grad-hot)}

/* ---------- Present view ---------- */
.pv{background:transparent}
.pv-top{background:rgba(255,255,255,.78);backdrop-filter:blur(16px) saturate(150%);border-bottom:1px solid var(--edge)}
.join-banner{font-weight:700}
.join-banner .codebig,.wel-join .codebig{font-family:var(--fd);font-weight:800;background:var(--grad-sun);border:none;box-shadow:0 10px 24px -12px rgba(255,170,60,.8);border-radius:14px;letter-spacing:.06em;transition:transform .3s var(--spring)}
.join-banner .codebig:hover,.wel-join .codebig:hover{transform:scale(1.05) rotate(-1.5deg)}
.qr,.wel-qr{border:1px solid var(--edge);box-shadow:var(--sh-sm);border-radius:14px}
.qr-modal .qr-big{border:1px solid var(--edge);border-radius:26px}
.qr-modal .code-xl{font-family:var(--fd);font-weight:800;background:var(--grad-sun);border:none;box-shadow:0 14px 30px -14px rgba(255,170,60,.85)}
.pv-count{font-weight:800;background:#fff;padding:8px 14px;border-radius:99px;border:1px solid var(--edge);box-shadow:var(--sh-sm)}
.pv-count b{font-family:var(--fd);font-weight:800}
.dot-live{background:var(--pink)}
.pv-stage{padding-top:30px}
.pv-stage .q-title{font-size:clamp(30px,3.9vw,58px);margin:14px 0 26px}
.pv-bar .group{border:1px solid var(--edge);border-radius:18px;box-shadow:var(--sh);background:rgba(255,255,255,.88);backdrop-filter:blur(12px)}
.hidden-res{font-family:var(--fd)}
.hidden-res b{background:var(--grad-hot);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* ---------- Fastest Fingers: big options, timer underneath ---------- */
.ff-track{background:#ECECF8;border:none;height:14px;box-shadow:inset 0 1px 2px rgba(36,38,77,.08)}
.ff-fill{background:linear-gradient(90deg,#FF4D8D,#FF9F1C 35%,#14C9A1 70%,#38AEFF);border-radius:99px;transition:width .25s linear}
.ff-opt{border:1.5px solid var(--edge);border-radius:20px;font-weight:700;background:#fff;box-shadow:var(--sh-sm);animation:optIn .6s var(--spring) backwards;transition:transform .3s var(--spring),box-shadow .3s}
.ff-opt:nth-child(2){animation-delay:.07s}.ff-opt:nth-child(3){animation-delay:.14s}.ff-opt:nth-child(4){animation-delay:.21s}.ff-opt:nth-child(n+5){animation-delay:.28s}
@keyframes optIn{from{opacity:0;transform:translateY(22px) scale(.94)}}
.ff-opt i{border-radius:12px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.ff-opt.ok{background:linear-gradient(135deg,#E3FBF3,#D4F7EC);border-color:#9BE8CF;box-shadow:0 14px 30px -14px rgba(20,201,161,.7)}
.pv-stage .ff-opts{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(12px,1.6vw,22px);margin-top:6px}
.pv-stage .ff-opt{font-size:clamp(20px,2.3vw,36px);padding:clamp(16px,2.2vh,28px) clamp(18px,1.8vw,30px);gap:clamp(12px,1.2vw,20px);border-radius:26px;min-height:clamp(72px,11vh,124px);line-height:1.2;word-break:break-word}
.pv-stage .ff-opt i{width:clamp(42px,3.6vw,62px);height:clamp(42px,3.6vw,62px);font-size:clamp(18px,1.7vw,28px);border-radius:16px}
.pv-stage .ff-chips{gap:14px}
.pv-stage .chip.big{font-size:clamp(20px,2.2vw,32px);padding:16px 24px;border-radius:18px}
.ff-run{display:flex;flex-direction:column}
.ff-timer{--tc:var(--orange);display:flex;align-items:center;gap:16px;width:min(720px,100%);margin:clamp(18px,3vh,30px) auto 0;padding:10px 20px 10px 10px;border-radius:99px;background:rgba(255,255,255,.92);border:1px solid var(--edge);box-shadow:var(--sh);animation:rise .6s .3s var(--ease) backwards}
.ff-ring{position:relative;width:66px;height:66px;flex:none;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:conic-gradient(var(--tc) calc(var(--p) * 1%),#ECECF8 0);transition:--p .3s linear}
.ff-ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}
.ff-ring b,.ff-ring small{position:relative;z-index:1;line-height:1}
.ff-ring b{font-family:var(--fd);font-weight:800;font-size:26px;color:var(--tc)}
.ff-ring small{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.ff-timer[style*="--tc"] .ff-ring{animation:ffPulse 1s infinite}
.ff-tbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.ff-tbody .ff-track{margin:0;width:100%;height:12px}
.ff-tbody .ff-sub{text-align:left;font-size:15px;font-weight:700}
.ff-tbody .ff-sub b{font-family:var(--fd);font-size:20px;font-weight:800}
.canvas .ff-timer{transform:scale(.9)}
.bz-top{margin:20px auto 0}
.bz-top b{font-family:var(--fd);font-weight:800}
.ff-big{font-family:var(--fd);font-weight:800}
.ff-row{border:1px solid var(--edge);border-radius:18px;box-shadow:var(--sh-sm)}
.ff-row.win{background:linear-gradient(90deg,#FFF5C9,#fff 70%);border-color:#FFE08A}
.ff-row.me,.fl-row.me{outline:2.5px solid var(--orange)}
.ff-name{font-weight:800}.ff-time{font-family:var(--fd);font-weight:700}
.ff-state h2{font-weight:800;letter-spacing:-.03em}
.ff-state p{font-weight:600}
.ff-correct{border:1px solid #9BE8CF;background:#E3FBF3;border-radius:14px;font-weight:800;box-shadow:var(--sh-sm)}
.ff-clock b,.sc-clock b{font-family:var(--fd);font-weight:800}
.chip{border:1.5px solid var(--edge);font-weight:700;box-shadow:var(--sh-sm)}
.chip.placed{background:#FFF4B8;border-color:#FFE08A}
.ord-ans{border:2px dashed #D6D4EE;background:#FAFAFF}
.sc-para{border:1px solid var(--edge);border-radius:24px;font-weight:600}
.tx-card{border:1px solid var(--edge);border-radius:28px}
.tx-body{font-weight:600}

/* ---------- Welcome slide ---------- */
.wel::before{content:"";position:absolute;left:50%;top:38%;width:min(760px,90%);aspect-ratio:2/1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(168,85,247,.16),rgba(56,174,255,.10) 55%,transparent);z-index:-1;animation:halo 6s ease-in-out infinite alternate;pointer-events:none}
@keyframes halo{to{transform:translate(-50%,-50%) scale(1.15)}}
.wel{isolation:isolate}
.wel-hi{font-family:var(--fd);font-weight:600;color:var(--muted);letter-spacing:-.01em}
.wel-app{font-family:var(--fd);font-weight:800;font-size:clamp(60px,9.4vw,156px);letter-spacing:-.05em;line-height:.95;margin:6px 0 10px;padding-bottom:4px}
.wel-by{font-weight:800;letter-spacing:.3em;color:var(--orange)}
.wel-title{border:1px solid var(--edge);border-radius:24px;box-shadow:var(--sh);font-family:var(--fd);font-weight:700;letter-spacing:-.02em;background:rgba(255,255,255,.92)}
.wel-title small{font-family:var(--fb);font-weight:800}
.wel-join .txt{font-weight:700}
.wel-qr{transition:transform .35s var(--spring)}
.wel-qr:hover{transform:scale(1.05) rotate(-2deg)}
.wel-emo{filter:drop-shadow(0 8px 14px rgba(36,38,77,.18))}
.canvas .wel-app{font-size:clamp(40px,5.2vw,88px)}
.tx-slide .wel-app{font-size:clamp(36px,4.6vw,68px)}
.wel-card .wel-app,.aud-card .tx-slide .wel-app{font-size:clamp(36px,10.4vw,58px)}
.wel-wait{font-family:var(--fd);font-weight:700;color:var(--ink)}
.wel-joined{border:1px solid var(--edge);box-shadow:var(--sh);font-weight:800}
.wel-joined:hover{transform:translateY(-3px) scale(1.03);box-shadow:var(--sh-lg)}
.wel-joined b{font-family:var(--fd);font-weight:800}
.wel-joined .ico{border:none;background:var(--grad-cool)}
.org-chip{font-family:var(--fd);font-weight:700;background:var(--grad-sun);border:none;box-shadow:0 10px 24px -12px rgba(255,170,60,.8)}
.av{border:2px solid #fff;font-family:var(--fd);font-weight:700;box-shadow:0 2px 6px rgba(36,38,77,.15)}

/* ---------- Audience ---------- */
.aud{background:transparent}
.aud-card{border-radius:28px}
.join-card{border-radius:30px}
.join-card h1{font-weight:800;letter-spacing:-.035em}
.code-in{font-family:var(--fd);font-weight:800;border:2px solid var(--edge);border-radius:20px;box-shadow:var(--sh-sm);transition:border-color .2s,box-shadow .25s,transform .3s var(--spring)}
.code-in:focus{background:#fff;border-color:var(--orange);box-shadow:0 0 0 5px rgba(109,93,252,.14);transform:scale(1.02)}
.anon{font-weight:700}
.opt{border:1.5px solid var(--edge);border-radius:18px;font-weight:700;box-shadow:var(--sh-sm);transition:transform .3s var(--spring),border-color .2s,background .2s,box-shadow .3s}
.opt:hover{border-color:#D3D1F0;transform:translateY(-2px);box-shadow:var(--sh)}
.opt .lt{border-radius:11px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.opt.sel{border-color:var(--orange);background:linear-gradient(135deg,#F5F3FF,#EFF6FF);box-shadow:0 0 0 4px rgba(109,93,252,.12),var(--sh)}
.rng-head b{font-family:var(--fd);font-weight:800}
.range{accent-color:var(--orange)}
.rk-item{border:1.5px solid var(--edge);box-shadow:var(--sh-sm);border-radius:16px}
.rk-item button{background:var(--soft)}
.budget{border-radius:16px;box-shadow:var(--sh-pri)}
.budget b{font-family:var(--fd);color:#FFF4A8}
.grid-item{border:1.5px solid var(--edge);border-radius:18px}
.stepper button{border:1.5px solid var(--edge);box-shadow:var(--sh-sm)}
.check{border:none;background:var(--grad-cool);box-shadow:0 0 0 10px rgba(20,201,161,.12),0 20px 40px -16px rgba(20,201,161,.7)}
.thanks h2{font-weight:800}
.waiting .orb{border:none;box-shadow:0 20px 40px -18px rgba(109,93,252,.6)}
.waiting .orb::after{border:none;background:#fff}
.progress i.on{background:var(--grad-hot)}
.upv{border:1.5px solid var(--edge)}
.upv.on{background:var(--grad-hot);border-color:transparent}
.locked-note{background:#FFEFF5;border-radius:16px}
.spinner{border-color:#E6E4FA;border-top-color:var(--orange)}
.dots i{background:var(--orange)}
.switch .sw{border:none;background:#DCDCF0;box-shadow:inset 0 1px 3px rgba(36,38,77,.15)}
.switch .sw::after{border:none;top:3px;left:3px;box-shadow:0 2px 5px rgba(36,38,77,.25)}
.switch input:checked+.sw{background:var(--grad-cool)}
.switch.star input:checked+.sw{background:var(--grad-sun)}
.ed-top .switch{border:1.5px solid var(--edge)}
.name-av{border:4px solid #fff;box-shadow:var(--sh)}
.name-av::after{border-color:var(--orange)}
.name-hi{color:var(--orange);font-family:var(--fd);font-weight:700}
.you-are{border:1px solid var(--edge)}
.jn-item{border:1px solid var(--edge);border-radius:16px}
.pod-step{border:none;border-radius:18px 18px 0 0}
.pod1 .pod-step{background:linear-gradient(180deg,#FFE97A,#FFB547)}
.pod2 .pod-step{background:linear-gradient(180deg,#EEF0FF,#C9CEEE)}
.pod3 .pod-step{background:linear-gradient(180deg,#FFD7C2,#F2A27A)}
.podium{border-bottom:3px solid var(--edge)}
.fl-row{border:1px solid var(--edge);border-radius:16px}
.ig-cell{border:1.5px solid var(--edge);border-radius:18px;transition:transform .3s var(--spring),box-shadow .3s}
.ig-cell:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.ig-cell .ig-n{border:none;background:var(--grad-sun)}
.ig-row{border:1px solid var(--edge);border-radius:16px}
.ig-row i{background:#ECE9FF}
.q-tab{border:1.5px solid var(--edge)}
.q-tab.on{border-color:transparent;box-shadow:var(--sh-sm)}
.set-box{border:2px dashed #D6D4EE;background:#FAFAFF}
.ses-row{border:1.5px solid var(--edge);background:#FAFAFF}
.zv button{border:none}

@media (max-width:520px){.brand-sub{font-size:18px;padding-left:10px}}
@media (max-width:700px){
  .pv-stage .ff-opts{grid-template-columns:1fr}
  .ff-timer{gap:12px;padding-right:14px}.ff-ring{width:56px;height:56px}.ff-ring b{font-size:22px}
  .dash-head h1{font-size:36px}
}

/* =================== SPARKLE STYLE LAYER =================== */
/* Look & feel inspired by a warm "sunrise sky" style:
   cream-to-lavender sky, heavy ink headlines with italic serif accents,
   frosted-glass cards, dark ink pill buttons, gold sparkles. */
:root{
  --fd:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --fb:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --serif:'Instrument Serif','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --navy:#1C1736;--navy2:#2B2352;--ink:#1C1736;--ink2:#48425F;--muted:#68637D;
  --orange:#6B4FF0;--violet:#8D75FF;--amber:#F5A623;--yellow:#FFCF4A;--pink:#E2478F;--mint:#22B573;--sky:#3B9EFF;
  --bg:#FBFAF6;--card:rgba(255,255,255,.82);--line:#EFEAF5;--soft:#F4EEFF;--edge:#ECE6F4;
  --sky-top:#FFF7EC;--sky-bottom:#F4EEFF;
  --grad-pri:linear-gradient(135deg,#8D75FF 0%,#6B4FF0 100%);
  --grad-hot:linear-gradient(135deg,#8D75FF 0%,#6B4FF0 50%,#E2478F 100%);
  --grad-cool:linear-gradient(135deg,#34D399 0%,#22B573 100%);
  --grad-sun:linear-gradient(135deg,#FFCF4A 0%,#F5A623 100%);
  --grad-gold-t:linear-gradient(100deg,#F7B23B 0%,#EE8F1E 55%,#C66A08 100%);
  --grad-violet-t:linear-gradient(100deg,#9A84FF 0%,#6B4FF0 55%,#5236D8 100%);
  --grad-rose-t:linear-gradient(100deg,#F06AA8 0%,#E2478F 55%,#B8306F 100%);
  --ring:inset 0 0 0 1px rgba(255,255,255,.95);
  --sh-sm:0 1px 3px rgba(50,30,140,.06),0 10px 24px -14px rgba(40,25,110,.38),var(--ring);
  --sh:0 2px 6px rgba(50,30,140,.06),0 24px 60px -20px rgba(50,30,140,.36),var(--ring);
  --sh-lg:0 4px 10px rgba(50,30,140,.07),0 40px 80px -26px rgba(50,30,140,.46),var(--ring);
  --sh-pri:0 14px 30px -14px rgba(28,23,54,.65);
  --ease:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.25,1.25,.4,1);
  --r:24px;
}
html{background:linear-gradient(180deg,var(--sky-top) 0%,#FCF6F1 45%,var(--sky-bottom) 100%) fixed;background-color:var(--bg)}
body{background:transparent;font-family:var(--fb);font-weight:450;color:var(--ink);letter-spacing:-.011em;font-feature-settings:"cv11","ss01"}
body::before{background:radial-gradient(circle,rgba(255,214,168,.75) 0%,transparent 66%);opacity:.8}
body::after{background:radial-gradient(circle,rgba(203,184,255,.7) 0%,transparent 66%);opacity:.8}
h1,h2,h3,h4,.display{font-family:var(--fd);font-weight:800;letter-spacing:-.035em}
h1 em,h2 em,h3 em,.ser{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;padding:0 .06em 0 .02em;
  background:var(--grad-violet-t);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
em.g-gold{background-image:var(--grad-gold-t)}em.g-rose{background-image:var(--grad-rose-t)}
::selection{background:#E7DFFF}
:focus-visible{outline:3px solid rgba(107,79,240,.4)}

/* ---------- Sparkles ---------- */
.twk{position:absolute;z-index:0;font-style:normal;pointer-events:none;color:var(--amber);font-size:calc(16px * var(--s,1));line-height:1;opacity:.0;
  text-shadow:0 0 12px rgba(245,166,35,.55);animation:twinkle 4.2s ease-in-out infinite}
.twk:nth-child(3n){color:#E79AC4;text-shadow:0 0 12px rgba(226,71,143,.4)}
.twk:nth-child(4n){color:#A996FF;text-shadow:0 0 12px rgba(107,79,240,.4)}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.9;transform:scale(1) rotate(45deg)}}

/* ---------- Buttons: ink pills + frosted pills ---------- */
.btn{border:0;border-radius:999px;background:rgba(255,255,255,.78);backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);
  box-shadow:var(--sh-sm);font-weight:650;color:var(--ink);padding:12px 22px;transition:transform .45s var(--spring),box-shadow .35s var(--ease),background .25s,color .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:transparent;background:#fff}
.btn:active{transform:translateY(0) scale(.96)}
.btn.primary,.btn.navy{background:var(--ink);color:#fff;box-shadow:var(--sh-pri)}
.btn.primary:hover,.btn.navy:hover{background:#2B2352;box-shadow:0 20px 36px -16px rgba(28,23,54,.7)}
.btn.mint{background:var(--grad-cool);color:#fff;box-shadow:0 14px 28px -14px rgba(34,181,115,.8)}
.btn.pink{background:linear-gradient(135deg,#F06AA8,#E2478F);color:#fff;box-shadow:0 14px 28px -14px rgba(226,71,143,.8)}
.btn.yellow,.btn.on{background:var(--grad-sun);color:var(--ink);box-shadow:0 14px 28px -14px rgba(245,166,35,.85)}
.btn.ghost{background:transparent;box-shadow:none;backdrop-filter:none}
.btn.ghost:hover{background:rgba(255,255,255,.7);color:var(--ink);box-shadow:var(--sh-sm)}
.btn.sm{padding:8px 15px;border-radius:999px;font-size:13.5px}
.btn.icon{border-radius:999px}
.card{background:var(--card);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border:0;border-radius:var(--r);box-shadow:var(--sh)}
.input{background:rgba(255,255,255,.88);border:1.5px solid var(--edge);border-radius:14px;font-weight:550;color:var(--ink)}
.input:hover{border-color:#DCD3F2}
.input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(107,79,240,.13);background:#fff}
.field>label,.lbl{color:var(--ink2);font-weight:700;letter-spacing:.12em}
.tag{border:0;background:rgba(255,255,255,.75);box-shadow:var(--sh-sm);font-weight:700}
.hint{background:rgba(255,255,255,.6);border:0;box-shadow:var(--ring),0 6px 18px -14px rgba(40,25,110,.4);color:var(--ink2)}
.muted{color:var(--muted)}

/* Eyebrows: numbered ring + tracked caps */
.eyebrow{display:inline-flex;align-items:center;gap:12px;background:none;padding:0;border-radius:0;color:var(--ink2);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:16px}
.eyebrow i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--orange);color:var(--orange);font-size:12px;letter-spacing:0;font-weight:700;background:rgba(255,255,255,.55)}
.eyebrow:not(:has(i))::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(245,166,35,.18)}

/* ---------- Brand ---------- */
.brand-sub{font-family:var(--fd);font-weight:800;font-size:21px;letter-spacing:-.035em;color:var(--ink);-webkit-text-fill-color:var(--ink);background:none;animation:none;border-left:1.5px solid rgba(28,23,54,.12)}
.brand.light{background:#fff;border:0;box-shadow:var(--sh-sm);border-radius:16px}

/* ---------- The big title ---------- */
.tl-wrap{filter:none;display:inline-block;white-space:nowrap}
.tl-part{display:inline-block;white-space:nowrap}
.tl{background:none;-webkit-text-fill-color:currentColor;color:var(--ink);padding:0;
  animation:tlIn 1s calc(var(--d) * 45ms + .1s) var(--ease) both,tlWave 8s calc(var(--d) * 70ms + 2.2s) ease-in-out infinite}
.tl-sans .tl{font-family:var(--fd);font-weight:830}
.tl-serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.005em;margin-left:.04em;font-size:1.08em}
.tl-serif .tl{background:var(--grad-gold-t);background-size:calc((var(--n) + 1) * 100%) 100%;background-position:calc(var(--i) / var(--n) * 100%) 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding:0 .07em .1em .03em;margin:0 -.05em 0 -.02em}
@keyframes tlIn{0%{opacity:0;transform:translateY(.42em);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
@keyframes tlWave{0%,7%,100%{transform:none}3.5%{transform:translateY(-.08em)}}
.bigname{font-size:clamp(60px,8.6vw,132px);letter-spacing:-.055em;line-height:.9;margin:22px 0 22px;color:var(--ink)}
.bigname .tl-wrap.stack .tl-part{display:block}
.bigname .tl-serif{margin:.02em 0 0 .02em}
.bigname small{font-family:var(--fb);color:var(--ink2);-webkit-text-fill-color:var(--ink2);font-weight:700;letter-spacing:.22em;font-size:clamp(11px,1vw,13px);margin-top:20px}
@media (max-width:520px){.bigname{font-size:clamp(52px,17vw,84px)}}

/* ---------- Toast / modal ---------- */
.toast{background:var(--ink);border-radius:999px;padding:12px 20px;box-shadow:0 18px 40px -16px rgba(28,23,54,.6)}
.toast.ok{background:linear-gradient(135deg,#2BC27F,#1E9E64)}.toast.err{background:linear-gradient(135deg,#F06AA8,#D23C7F)}
.modal-bg{background:rgba(42,32,90,.22);backdrop-filter:blur(12px) saturate(1.3)}
.modal{background:rgba(255,255,255,.9);border-radius:30px;box-shadow:var(--sh-lg)}
.modal p.sub{color:var(--ink2)}

/* ---------- Landing ---------- */
.nav{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;transition:background .35s,box-shadow .35s}
.nav.scrolled{background:rgba(255,250,245,.6);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 10px 30px -26px rgba(40,25,110,.6);border:0}
.nav-links{background:rgba(255,255,255,.62);backdrop-filter:blur(12px);padding:5px;border-radius:999px;box-shadow:var(--sh-sm);gap:2px}
.nav-links a{border-radius:999px;font-weight:600;font-size:14.5px;color:var(--ink2);padding:8px 14px}
.nav-links a::after{display:none}
.nav-links a:hover{background:#fff;color:var(--ink)}
.hero{padding:40px 0 110px}
.hero .wrap{position:relative;z-index:1}
.hero .twk{z-index:0}
.blob{opacity:.55}
.pill{background:rgba(255,255,255,.62);border:0;box-shadow:var(--sh-sm);font-weight:650;color:var(--ink2);padding:8px 16px 8px 12px;font-size:13.5px}
.pill i{width:10px;height:10px;background:var(--amber);font-size:0;animation:none;box-shadow:0 0 0 4px rgba(245,166,35,.2)}
.hero h1{font-size:clamp(26px,2.9vw,40px);font-weight:800;letter-spacing:-.04em;color:var(--ink);margin:4px 0 16px}
.hl{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;background:var(--grad-violet-t);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-right:.08em;white-space:nowrap}
.hl svg{display:none}
.hero p.lead{color:var(--ink2);font-weight:450;font-size:18px;line-height:1.6}
.modes{gap:14px}
.mode-btn{border-radius:28px;padding:24px;isolation:isolate}
.mode-btn.p{background:radial-gradient(120% 140% at 85% 0%,#5B3FD6 0%,transparent 55%),linear-gradient(160deg,#2A1E6E 0%,#1C1736 70%);color:#fff;box-shadow:0 26px 50px -24px rgba(28,23,54,.8),inset 0 0 0 1px rgba(255,255,255,.08)}
.mode-btn.p::after{color:var(--yellow)}
.mode-btn.u{background:rgba(255,255,255,.8);backdrop-filter:blur(16px);color:var(--ink);box-shadow:var(--sh)}
.mode-btn.u .mi{background:var(--grad-pri)}
.mode-btn.p .mi{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.mode-btn.p .mi svg{stroke:var(--yellow)}
.mode-btn h3{font-weight:800;letter-spacing:-.035em}
.mode-btn span{opacity:.75;font-weight:550}
.mode-btn:hover{transform:translateY(-6px);box-shadow:var(--sh-lg)}
.mode-btn.p:hover{box-shadow:0 34px 60px -26px rgba(28,23,54,.9)}
.quick{color:var(--ink2);font-weight:650}
.quick .input{border-radius:999px;background:rgba(255,255,255,.8)}
/* phone mockup in a dark device frame */
.phone{background:linear-gradient(180deg,#F6F2FF 0%,#FFF8EE 100%);border:10px solid #15141B;border-radius:46px;padding:40px 18px 22px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 0 0 1px #5A5964,0 30px 60px -16px rgba(40,25,110,.5),0 12px 24px -10px rgba(40,25,110,.35)}
.phone::before{top:10px;width:78px;height:22px;border-radius:99px;background:#0B0B10}
.phone .q{font-weight:800;letter-spacing:-.03em;margin-top:6px}
.phone .opt-demo{background:rgba(255,255,255,.85);border:0;box-shadow:var(--sh-sm);font-weight:650}
.phone .opt-demo.sel{background:#fff;box-shadow:0 0 0 2px var(--orange),0 10px 24px -12px rgba(107,79,240,.6)}
@keyframes pulseSel{0%,30%{box-shadow:var(--sh-sm)}40%,100%{box-shadow:0 0 0 2px #6B4FF0,0 10px 24px -12px rgba(107,79,240,.6)}}
.phone .opt-demo i{border-radius:8px}
.phone .send{background:var(--ink);border-radius:999px;box-shadow:var(--sh-pri)}
.screen,.cloud-card,.chip-live{border-radius:22px}
.chip-live{border-radius:999px;font-weight:700}
.screen h4{font-weight:700;letter-spacing:-.02em}
.cloud-card span{font-family:var(--fd);font-weight:800;letter-spacing:-.04em}
.cloud-card span:nth-child(odd){font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0}
/* marquee becomes a calm frosted ribbon with gold sparkles */
.marquee{background:rgba(255,255,255,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);transform:none;margin:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.95),0 20px 40px -30px rgba(40,25,110,.5);animation:none;padding:18px 0}
.marquee-in{gap:34px}
.marquee-in>span{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:-.025em;gap:10px}
.marquee-in>span::after{content:"✦";color:var(--amber);margin-left:24px;font-size:15px}
.marquee .ticon{color:inherit}
.marquee .ticon[style]{opacity:1}
section.sec{padding:110px 0}
.sec-head{text-align:left;margin:0 0 50px;max-width:820px}
.sec-head h2{font-size:clamp(38px,5vw,66px);font-weight:800;letter-spacing:-.05em;line-height:1.02;color:var(--ink)}
.sec-head p{color:var(--ink2);font-weight:450;font-size:18px;max-width:600px}
#how{background:transparent!important;border:0!important}
.type-card{background:rgba(255,255,255,.72);border-radius:26px;padding:24px}
.type-card .ti{width:54px;height:54px;border-radius:16px;box-shadow:var(--ring)}
.type-card h4{font-weight:750;letter-spacing:-.03em}
.type-card p,.step p,.feat p{color:var(--ink2);font-weight:450}
.type-card:hover{transform:translateY(-8px);box-shadow:var(--sh-lg)}
.step{background:rgba(255,255,255,.72)}
.step .n{background:rgba(255,255,255,.7)!important;color:var(--orange);border:1px solid var(--orange);border-radius:50%;box-shadow:none;font-family:var(--fd);font-size:18px;font-weight:700;width:46px;height:46px}
.step .n::before{content:"0"}
.step:nth-child(2) .n{color:var(--amber);border-color:var(--amber)}.step:nth-child(3) .n{color:var(--pink);border-color:var(--pink)}
.step h4{font-weight:800;letter-spacing:-.035em;font-size:25px}
.feat{border:0;box-shadow:var(--sh-sm);border-radius:26px}
.feat h4{font-weight:750;letter-spacing:-.03em}
/* night-sky call to action */
.cta{background:radial-gradient(90% 120% at 90% 0%,rgba(141,117,255,.55) 0%,transparent 55%),radial-gradient(70% 100% at 0% 100%,rgba(226,71,143,.35) 0%,transparent 60%),linear-gradient(160deg,#2A1E6E 0%,#1C1736 70%);
  box-shadow:0 40px 80px -36px rgba(28,23,54,.85),inset 0 0 0 1px rgba(255,255,255,.08);border-radius:36px;padding:64px}
.cta::before,.cta::after{display:none}
.cta h2{color:#fff;font-size:clamp(32px,4.2vw,54px);letter-spacing:-.045em;font-weight:800}
.cta h2 em{padding-right:.1em}
.cta .btn.yellow{color:var(--ink)}
.cta .btn:not(.yellow){background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);backdrop-filter:blur(8px)}
.cta .btn:not(.yellow):hover{background:rgba(255,255,255,.18)}
footer.foot{background:radial-gradient(80% 120% at 50% 0%,#2A1E6E 0%,#120E2E 70%);color:rgba(245,242,255,.66);border:0}
.foot h5{color:#fff;font-weight:700;letter-spacing:-.02em}
.foot ul a:hover{color:var(--yellow)}
.foot-bottom{border-top:1px solid rgba(255,255,255,.1)}
.foot-wave{opacity:.05;filter:invert(1)}
.mini-foot{color:var(--muted)}
.mini-foot b{background:var(--grad-violet-t);-webkit-background-clip:text;background-clip:text}

/* ---------- Dashboard / login ---------- */
.topbar,.ed-top{background:rgba(255,250,245,.6);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-bottom:0;box-shadow:0 10px 30px -26px rgba(40,25,110,.6)}
.dash-head h1{font-size:clamp(40px,4.6vw,60px);letter-spacing:-.05em}
.pcard{background:rgba(255,255,255,.78);border-radius:26px}
.pcard .cover{margin:8px 8px 0;border-radius:20px;height:118px}
.pcard .code{border-radius:999px;background:rgba(255,255,255,.9);color:var(--ink);box-shadow:var(--sh-sm)}
.pcard h3{font-weight:800;letter-spacing:-.035em}
.pcard .meta{color:var(--muted);font-weight:550}
.new-card{border:1.5px dashed rgba(107,79,240,.35);background:rgba(255,255,255,.4);font-family:var(--fd);font-weight:700;letter-spacing:-.02em;border-radius:26px;color:var(--ink2)}
.new-card:hover{background:rgba(255,255,255,.75);border-color:var(--orange);color:var(--ink)}
.new-card .plus{background:var(--ink);border-radius:50%;box-shadow:var(--sh-pri)}
.new-card:hover .plus{transform:rotate(90deg) scale(1.08)}
.lock-ico{background:var(--ink);border-radius:24px;box-shadow:var(--sh-pri)}
.lock-ico svg{stroke:var(--yellow)}
.join-card h1{font-size:40px;letter-spacing:-.045em}

/* ---------- Editor ---------- */
.ed-side,.ed-panel{background:rgba(255,255,255,.5);backdrop-filter:blur(14px);border-color:rgba(255,255,255,.8)}
.ed-main{background:radial-gradient(rgba(107,79,240,.13) 1.1px,transparent 1.2px) 0 0/24px 24px,transparent}
.thumb{background:rgba(255,255,255,.75);border:0;box-shadow:var(--sh-sm);border-radius:16px}
.thumb.sel{background:#fff;box-shadow:0 0 0 2px var(--orange),0 12px 24px -14px rgba(107,79,240,.6)}
.thumb .tools{border:0;box-shadow:var(--sh-sm)}
.add-slide{border:1.5px dashed rgba(107,79,240,.35);border-radius:16px;color:var(--ink2);background:rgba(255,255,255,.35)}
.add-slide:hover{background:rgba(255,255,255,.8);border-color:var(--orange);color:var(--ink)}
.canvas{border-radius:28px}
.type-pick button{border:0;background:rgba(255,255,255,.8);box-shadow:var(--sh-sm);border-radius:18px}
.type-pick button:hover{box-shadow:0 0 0 2px var(--orange),var(--sh)}

/* ---------- Slide stage ---------- */
.q-chip{background:rgba(255,255,255,.6);border:0;box-shadow:var(--sh-sm);color:var(--ink2);font-weight:700;letter-spacing:.12em;font-size:12px}
.q-title{font-family:var(--fd);font-weight:820;letter-spacing:-.045em;color:var(--ink)}
.mc-track{border-bottom:1.5px solid rgba(28,23,54,.12)}
.mc-fill{border-radius:18px 18px 6px 6px;box-shadow:0 -10px 30px -16px rgba(40,25,110,.4)}
.mc-val b{font-weight:800;letter-spacing:-.04em}
.mc-val span{color:var(--muted)}
.mc-lab{font-weight:650;color:var(--ink2)}
.wc-w{font-family:var(--fd);font-weight:800;letter-spacing:-.045em}
.wc-w:nth-child(3n+2){font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.wc-w.top{text-shadow:0 12px 30px rgba(107,79,240,.22)}
.oe-card,.qa-item,.ff-row,.fl-row,.jn-item,.ig-row,.rk-item,.grid-item{background:rgba(255,255,255,.82);border:0;box-shadow:var(--sh-sm)}
.oe-card{box-shadow:inset 0 3px 0 var(--c),var(--sh-sm);border-radius:20px}
.sc-track,.ff-track{background:rgba(28,23,54,.07)}
.rk-n,.ff-rank,.rk-item .n,.chip i,.budget,.fm-table th{background:var(--ink)}
.ff-rank.m{background:none}
.gs-bar{background:linear-gradient(#FFDB80,var(--amber))}
.gs-mark{border-left-color:var(--orange)}
.gs-mark span{background:var(--ink)}
.gr-box{border:0;box-shadow:var(--sh);background:linear-gradient(#D9D2EE,#D9D2EE) center/1.5px 100% no-repeat,linear-gradient(#D9D2EE,#D9D2EE) center/100% 1.5px no-repeat,linear-gradient(135deg,#FFF6EA 0 50%,#F2ECFF 50%)}
.fm-table{border:0;box-shadow:var(--sh-sm)}
.pin-wrap{border:0;box-shadow:var(--sh)}
.pin-dot{background:var(--orange)}

/* ---------- Present view ---------- */
.pv-top{background:rgba(255,250,245,.55);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:0;box-shadow:0 10px 30px -26px rgba(40,25,110,.6)}
.join-banner{color:var(--ink2);font-weight:600}
.join-banner b{color:var(--ink)}
.join-banner .codebig,.wel-join .codebig,.qr-modal .code-xl{background:var(--ink);color:var(--yellow);font-family:var(--fd);font-weight:800;letter-spacing:.04em;border-radius:999px;box-shadow:var(--sh-pri);padding-left:.55em;padding-right:.55em}
.qr,.wel-qr,.qr-modal .qr-big{border:0;background:#fff;box-shadow:var(--sh)}
.pv-count{background:rgba(255,255,255,.75);border:0;box-shadow:var(--sh-sm);font-weight:650;color:var(--ink2)}
.pv-count b{color:var(--ink)}
.pv-bar .group{background:rgba(255,255,255,.66);border:0;border-radius:999px;box-shadow:var(--sh);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);padding:5px}
.pv-stage .q-title{font-size:clamp(32px,4vw,62px);line-height:1.04}
.hidden-res{font-family:var(--fd);color:var(--ink2);font-weight:700}

/* Fastest Fingers: big frosted options, timer pill underneath */
.ff-opt{background:rgba(255,255,255,.82);border:0;box-shadow:var(--sh);border-radius:22px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.ff-opt i{border-radius:14px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 6px 14px -6px rgba(28,23,54,.35)}
.pv-stage .ff-opt{border-radius:28px;font-weight:750;letter-spacing:-.03em}
.pv-stage .ff-opt i{border-radius:18px}
.ff-opt.ok{background:linear-gradient(135deg,#ECFDF4,#DDF8EA);box-shadow:0 0 0 2.5px #22B573,0 20px 40px -18px rgba(34,181,115,.7)}
.ff-timer{--tc:var(--orange);background:rgba(255,255,255,.72);border:0;box-shadow:var(--sh);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5)}
.ff-ring{background:conic-gradient(var(--tc) calc(var(--p) * 1%),rgba(28,23,54,.08) 0)}
.ff-ring b{font-weight:800;letter-spacing:-.04em}
.ff-fill{background:linear-gradient(90deg,#FFCF4A,#F5A623 30%,#E2478F 65%,#6B4FF0)}
.ff-tbody .ff-sub{color:var(--ink2)}
.ff-tbody .ff-sub b{color:var(--ink)}
.ff-row.win{background:linear-gradient(90deg,#FFF3D1,rgba(255,255,255,.85) 70%);box-shadow:0 0 0 2px rgba(245,166,35,.7),0 20px 44px -18px rgba(245,166,35,.6)}
.ff-state h2{font-weight:820;letter-spacing:-.045em}
.ff-state p{color:var(--ink2)}
.ff-correct{background:#ECFDF4;border:0;box-shadow:0 0 0 1.5px #8EDDB6,var(--sh-sm)}
.chip{border:0;background:rgba(255,255,255,.85);box-shadow:var(--sh-sm)}
.chip.placed{background:#FFF1C7}
.sc-para,.tx-card{background:rgba(255,255,255,.8);border:0;box-shadow:var(--sh)}

/* ---------- Welcome slide ---------- */
.wel::before{background:radial-gradient(closest-side,rgba(255,214,168,.55),rgba(203,184,255,.35) 60%,transparent);width:min(900px,95%)}
.wel .twk{z-index:-1}
.wel-hi{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--ink2);font-size:clamp(24px,2.6vw,38px);letter-spacing:-.01em}
.wel-app{font-size:clamp(64px,9.6vw,160px);letter-spacing:-.055em;line-height:1;color:var(--ink);margin:2px 0 14px}
.wel-by{color:var(--ink2);letter-spacing:.24em;font-weight:700}
.wel-by::before,.wel-by::after{content:"✦";color:var(--amber);margin:0 12px;letter-spacing:0}
.wel-title{background:rgba(255,255,255,.78);border:0;box-shadow:var(--sh);border-radius:26px;font-family:var(--fd);font-weight:800;letter-spacing:-.04em;color:var(--ink);backdrop-filter:blur(16px)}
.wel-title small{color:var(--muted);font-weight:700}
.wel-join .txt{color:var(--ink2);font-weight:600}
.wel-joined{background:rgba(255,255,255,.78);border:0;box-shadow:var(--sh);backdrop-filter:blur(14px);font-weight:700}
.wel-joined .ico{background:var(--grad-pri)}
.wel-joined b{color:var(--orange)}
.wel-wait{font-family:var(--fd);font-weight:800;letter-spacing:-.035em}
.canvas .wel-app{font-size:clamp(44px,5.4vw,92px)}
.tx-slide .wel-app{font-size:clamp(40px,4.8vw,72px)}
.wel-card .wel-app,.aud-card .tx-slide .wel-app{font-size:clamp(40px,11.5vw,62px)}
.org-chip{background:var(--grad-sun);color:var(--ink);font-family:var(--fd);font-weight:750;border:0;box-shadow:0 12px 26px -14px rgba(245,166,35,.85)}
.av{border:2px solid #fff;font-family:var(--fd);font-weight:700}

/* ---------- Audience ---------- */
.aud-card,.join-card{background:rgba(255,255,255,.78);border-radius:30px}
.code-in{font-family:var(--fd);font-weight:800;letter-spacing:.24em;color:var(--ink);background:rgba(255,255,255,.9);border:1.5px solid var(--edge);border-radius:22px}
.code-in:focus{border-color:var(--orange);box-shadow:0 0 0 5px rgba(107,79,240,.13);background:#fff}
.opt{background:rgba(255,255,255,.85);border:0;box-shadow:var(--sh-sm);border-radius:20px;font-weight:650;color:var(--ink)}
.opt:hover{border:0;box-shadow:var(--sh)}
.opt.sel{background:#fff;border:0;box-shadow:0 0 0 2.5px var(--orange),0 16px 32px -16px rgba(107,79,240,.6)}
.opt .lt{border-radius:12px}
.submit{border-radius:999px}
.anon{color:var(--muted);font-weight:600}
.check{background:var(--grad-cool);box-shadow:0 0 0 10px rgba(34,181,115,.12),0 22px 40px -18px rgba(34,181,115,.8)}
.progress i{background:rgba(28,23,54,.1)}
.progress i.on{background:var(--ink)}
.waiting .orb{background:conic-gradient(#FFCF4A,#F5A623,#E2478F,#6B4FF0,#8D75FF,#FFCF4A)}
.upv.on{background:var(--ink)}
.switch .sw{background:rgba(28,23,54,.14)}
.switch input:checked+.sw{background:var(--orange)}
.switch.star input:checked+.sw{background:var(--amber)}
.ed-top .switch{border:0;background:rgba(255,255,255,.75);box-shadow:var(--sh-sm);border-radius:999px}
.name-av::after{border-color:var(--amber)}
.name-hi{font-family:var(--serif);font-style:italic;font-weight:400;font-size:24px;color:var(--orange)}
.you-are{border:0;box-shadow:var(--sh-sm)}
.pod-step{box-shadow:var(--ring)}
.pod1 .pod-step{background:linear-gradient(180deg,#FFE48A,#F5A623)}
.pod2 .pod-step{background:linear-gradient(180deg,#F3F0FF,#CFC6EE)}
.pod3 .pod-step{background:linear-gradient(180deg,#FFE0C8,#EE9F6E)}
.podium{border-bottom:2px solid rgba(28,23,54,.1)}
.ig-cell{border:0;box-shadow:var(--sh-sm)}
.ig-row i{background:#EFE9FF}.ig-row.ok i{background:#D9F6E8}
.set-box,.ses-row{background:rgba(255,255,255,.55);border:1.5px dashed rgba(107,79,240,.25)}
.q-tab{border:0;background:rgba(255,255,255,.8);box-shadow:var(--sh-sm)}
.locked-note{background:#FFF0F6}
.spinner{border-color:rgba(28,23,54,.08);border-top-color:var(--orange)}
.dots i{background:var(--amber)}

@media (max-width:700px){
  .cta{padding:36px 26px}
  .sec-head h2{font-size:clamp(34px,10vw,46px)}
}
@media (prefers-reduced-motion:reduce){.twk{display:none}}
.step:nth-child(n) .n{background:rgba(255,255,255,.7)!important}
.marquee .ticon{color:var(--orange)!important}
.hl{padding-right:.04em}
@media (min-width:1001px){.bigname{font-size:clamp(60px,7.6vw,120px)}}
.step .n{display:flex;align-items:center;justify-content:center}

/* ---------- Logo variants ---------- */
.logo-dark{display:none}

/* ---------- Presenting screen always fits the screen (no scrolling, nothing cut off) ---------- */
#app>.pv{height:100vh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pv-top{flex:none}
.pv-stage{flex:1 1 auto;min-height:0;overflow:auto;padding-top:clamp(12px,2.6vh,34px);padding-bottom:clamp(8px,1.4vh,20px)}
.pv-bar{flex:none;padding-top:clamp(6px,1.1vh,14px);padding-bottom:clamp(8px,1.4vh,16px)}
.pv .wel{padding:0;justify-content:center}
.pv .wel-logo{height:clamp(40px,9vh,112px)}
.pv .wel-hi{margin-top:clamp(4px,1.4vh,24px);font-size:clamp(16px,min(2.6vw,3.6vh),36px)}
.pv .wel-app{font-size:min(9.4vw,15vh);margin:clamp(2px,.5vh,6px) 0 clamp(4px,1.1vh,14px)}
.pv .wel-by{font-size:clamp(10px,min(1vw,1.4vh),14px)}
.pv .wel-title{margin-top:clamp(8px,2.4vh,30px);padding:clamp(6px,1.3vh,16px) clamp(18px,2vw,30px);font-size:clamp(18px,min(3vw,4.4vh),44px)}
.pv .wel-title small{font-size:clamp(9px,1.2vh,12px)}
.pv .wel-join{margin-top:clamp(8px,2.4vh,30px)}
.pv .wel-qr{width:clamp(70px,14vh,150px);height:clamp(70px,14vh,150px)}
.pv .wel-join .codebig{font-size:clamp(26px,min(4vw,6.4vh),64px)}
.pv .wel-join .txt{font-size:clamp(14px,1.9vh,18px)}
.pv .wel-joined{margin-top:clamp(8px,2vh,24px)}
.pv .wel-wait{margin-top:clamp(10px,3vh,32px)}
.pv-stage .q-title{font-size:clamp(28px,min(4vw,6.6vh),62px);margin:clamp(8px,1.4vh,14px) 0 clamp(12px,2.6vh,26px)}
.pv .qr{width:clamp(54px,7.4vh,74px);height:clamp(54px,7.4vh,74px)}

/* Top bars stay locked while scrolling (body must not be its own scroll box; html already clips sideways overflow) */
body{overflow-x:visible}
.nav,.topbar{position:sticky;top:0;z-index:60}

/* ---------- Presenting screen: nothing scrolls, the slide is shrunk to fit instead ---------- */
.pv-stage{overflow:hidden}
.pv .stage-anim{overflow:hidden;min-height:0}
.pv .stage-anim>.res{flex:1 1 auto;min-height:0}
/* long lists fill the space that is left (two columns when there are many) and show "+N more" instead of scrolling */
.pv .ff-board,.pv .qa-list,.pv .oe,.pv .fl-list,.pv .fm-scroll{flex:0 1 auto;min-height:0;max-height:none;overflow:hidden;position:relative}
.pv .ff-board:has(>:nth-child(9)),.pv .qa-list:has(>:nth-child(7)),.pv .fl-list:has(>:nth-child(7)){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;align-content:start;width:100%}
.pv .oe{columns:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-content:start;align-items:start}
.pv .oe-card{margin:0}
.pv .res>[data-more]:not([data-more=""]){-webkit-mask:linear-gradient(#000 calc(100% - 90px),transparent);mask:linear-gradient(#000 calc(100% - 90px),transparent)}
.pv .res[data-more]:not([data-more=""])::after{content:attr(data-more);position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:3;padding:7px 16px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 10px 24px -12px rgba(0,0,0,.5);animation:rise .5s var(--ease) both}
.pv .sc-para,.pv .tx-card,.pv .tx-slide .tx-card,.pv .sc-look .sc-para{overflow:hidden}
.pv,.pv *{scrollbar-width:none}
.pv ::-webkit-scrollbar{display:none}
.pv .wel::before{top:46%}

/* =================== FLUX DASHBOARD LAYER =================== */
/* Dashboard look: dark rounded frame on a pale-lime page, light-grey panels,
   flat white cards, lime + lavender + black accents, Poppins. */
:root{
  --fd:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --fb:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --serif:'Poppins',system-ui,sans-serif;
  --frame:#1C1C1E;--frame2:#2A2A2D;--panel:#E8E8E8;--lime:#D4F15B;--lime2:#C3E246;--lav:#B6A8F4;--lav2:#8C7AEA;
  --navy:#1C1C1E;--navy2:#2A2A2D;--ink:#1C1C1E;--ink2:#4A4A50;--muted:#7C7C83;
  --orange:#7A66E8;--violet:#B6A8F4;--amber:#C3E246;--yellow:#D4F15B;--pink:#F2668B;--mint:#9BC53D;--sky:#9FD6F2;
  --bg:#E8E8E8;--card:#FFFFFF;--line:#EDEDED;--soft:#F3F3F3;--edge:#E2E2E4;
  --grad-pri:linear-gradient(#1C1C1E,#1C1C1E);--grad-hot:linear-gradient(#B6A8F4,#B6A8F4);--grad-cool:linear-gradient(#D4F15B,#D4F15B);--grad-sun:linear-gradient(#D4F15B,#D4F15B);
  --ring:0 0 0 0 transparent;
  --sh-sm:none;--sh:0 1px 0 rgba(0,0,0,.02);--sh-lg:0 22px 44px -24px rgba(0,0,0,.35);--sh-pri:none;
  --r:24px;--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.3,1.35,.4,1);
  --stripes:repeating-linear-gradient(135deg,rgba(0,0,0,.13) 0 2px,transparent 2px 8px);
}
html{background:#E3F1A8}
body{padding:14px;font-family:var(--fb);font-weight:400;letter-spacing:-.01em;color:var(--ink);background:transparent}
body::before,body::after,.twk{display:none}
h1,h2,h3,h4,.display{font-family:var(--fd);font-weight:500;letter-spacing:-.035em}
h1 em,h2 em,h3 em,.ser{font-family:var(--fd);font-style:normal;font-weight:inherit;letter-spacing:inherit;color:var(--ink);-webkit-text-fill-color:var(--ink);
  background:var(--lime);padding:0 .2em;border-radius:.32em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
em.g-gold,em.g-rose{background:var(--lav)}
::selection{background:var(--lime);color:var(--ink)}
:focus-visible{outline:3px solid var(--lav2)}

/* ---------- The frame ---------- */
#app{background:var(--frame);border-radius:34px;min-height:calc(100vh - 28px);padding:0 12px 12px;overflow:clip;position:relative}
#app>.hero,#app>.marquee,#app>section.sec,#app>.wrap,#app>.dash,#app>.aud,#app>.join-card{background:var(--panel)}
#app>.hero{border-radius:28px 28px 0 0}
#app>.wrap{width:auto;margin:0;padding:10px max(20px,calc((100% - 1180px) / 2)) 90px;border-radius:0 0 28px 28px}
#app>footer.foot{background:transparent}
#app>.dash{width:auto;margin:0;padding:40px max(22px,calc((100% - 1180px) / 2)) 60px;border-radius:28px;min-height:calc(100vh - 160px)}
#app>.aud{margin-top:12px;border-radius:28px;min-height:calc(100vh - 52px);background:var(--panel)}
#app>.mini-foot,#app .aud>.mini-foot{color:var(--muted)}
#app>.mini-foot b,.mini-foot b{background:none;-webkit-text-fill-color:currentColor;color:var(--lime)}
.aud .mini-foot b{color:var(--ink)}
#app>.pv{min-height:calc(100vh - 28px);background:transparent}
.pv-stage{max-width:none;background:var(--panel);border-radius:28px 28px 0 0;padding:30px max(22px,calc((100% - 1320px) / 2)) 16px}
.pv-bar{background:var(--panel);border-radius:0 0 28px 28px;padding:12px 14px 16px}
#app>.ed{height:calc(100vh - 40px);gap:0 12px;grid-template-columns:250px 1fr 340px}
.loader{background:var(--panel);border-radius:28px;margin-top:12px}

/* logo: white-lettered vector version on the dark frame, normal one on light panels */
.logo-dark{display:none!important}
.nav .logo-std,.topbar .logo-std,.pv-top .logo-std,.foot .logo-std{display:none!important}
.nav .logo-dark,.topbar .logo-dark,.pv-top .logo-dark,.foot .logo-dark{display:block!important}
.brand-sub{font-family:var(--fd);font-weight:600;font-size:21px;letter-spacing:-.03em;color:var(--ink);-webkit-text-fill-color:var(--ink);border-left:1.5px solid rgba(0,0,0,.12)}
.nav .brand-sub,.topbar .brand-sub,.pv-top .brand-sub,.foot .brand-sub{color:#fff;-webkit-text-fill-color:#fff;border-left-color:rgba(255,255,255,.16)}
.brand.light{background:transparent;box-shadow:none;padding:0}

/* ---------- Buttons ---------- */
.btn{background:#fff;color:var(--ink);border:0;border-radius:999px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;font-weight:500;padding:12px 22px;
  transition:transform .4s var(--spring),background .2s,color .2s,box-shadow .3s}
.btn:hover{background:#F4F4F4;transform:translateY(-2px);box-shadow:0 10px 22px -14px rgba(0,0,0,.35)}
.btn.primary,.btn.navy{background:var(--ink);color:#fff;box-shadow:none}
.btn.primary:hover,.btn.navy:hover{background:#000}
.btn.mint,.btn.yellow,.btn.on{background:var(--lime);color:var(--ink);box-shadow:none}
.btn.mint:hover,.btn.yellow:hover,.btn.on:hover{background:var(--lime2)}
.btn.pink{background:var(--pink);color:#fff;box-shadow:none}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:rgba(0,0,0,.06);box-shadow:none}
.btn.sm{padding:8px 15px;font-size:13.5px}
.nav .btn.primary,.topbar .btn.primary{background:#fff;color:var(--ink)}
.nav .btn.ghost,.topbar .btn.ghost,.ed-top .btn.ghost,.pv-top .btn.ghost{color:#fff}
.nav .btn.ghost:hover,.topbar .btn.ghost:hover,.ed-top .btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.primary::after,.btn.mint::after,.btn.pink::after,.btn.navy::after,.btn.yellow::after{background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%)}
.card{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;border:0;border-radius:24px}
.input{background:#fff;border:1.5px solid var(--edge);border-radius:14px;font-weight:400;color:var(--ink)}
.input:hover{border-color:#CFCFD4}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(212,241,91,.7)}
.field>label,.lbl{color:var(--muted);font-weight:500;letter-spacing:.06em}
.tag{background:#fff;box-shadow:none;font-weight:500}
.hint{background:#F4F4F4;box-shadow:none;color:var(--ink2);border-radius:16px}
.chk input{accent-color:var(--ink)}

/* Small labels */
.eyebrow{color:var(--muted);font-weight:500;letter-spacing:.12em;font-size:12px}
.eyebrow i{background:var(--ink);color:var(--lime);border:0;width:32px;height:32px;font-weight:600}
.eyebrow:not(:has(i))::before{background:var(--lav2);box-shadow:0 0 0 4px rgba(182,168,244,.35)}

/* ---------- Title: "Mentee-" + "Mentor" in a lime pill ---------- */
.tl-sans .tl{font-family:var(--fd);font-weight:600}
.tl-serif{font-family:var(--fd);font-style:normal;font-weight:600;font-size:1em;letter-spacing:-.045em;margin-left:.06em;padding:0 .16em .02em .12em;border-radius:.2em;
  background:linear-gradient(var(--lime),var(--lime)) no-repeat 0 0/100% 100%;animation:pillGrow 1s .35s var(--ease) both}
@keyframes pillGrow{from{background-size:0% 100%}}
.tl-serif .tl{background:none;color:var(--ink);-webkit-text-fill-color:var(--ink);padding:0;margin:0}
.tl{animation:tlIn .9s calc(var(--d) * 45ms + .1s) var(--ease) both,tlWave 8s calc(var(--d) * 70ms + 2.2s) ease-in-out infinite}
@keyframes tlIn{0%{opacity:0;transform:translateY(.5em) rotate(6deg)}100%{opacity:1;transform:none}}
.bigname{letter-spacing:-.06em;line-height:1;color:var(--ink)}
.bigname .tl-serif{display:inline-block!important;margin:.06em 0 0 -.04em}
.bigname small{font-family:var(--fb);font-weight:500;color:var(--muted);-webkit-text-fill-color:var(--muted);letter-spacing:.2em}

/* ---------- Toast / modal ---------- */
.toast{background:var(--ink);border-radius:999px;box-shadow:0 18px 40px -16px rgba(0,0,0,.5)}
.toast.ok{background:var(--lime);color:var(--ink)}.toast.err{background:var(--pink)}
.modal-bg{background:rgba(28,28,30,.42);backdrop-filter:blur(6px)}
.modal{background:#fff;border-radius:28px;box-shadow:0 30px 70px -30px rgba(0,0,0,.5)}

/* ---------- Landing ---------- */
.nav{background:var(--frame)!important;backdrop-filter:none!important;box-shadow:none!important;padding:16px 0}
.nav-links{background:var(--frame2);box-shadow:none;backdrop-filter:none;padding:5px}
.nav-links a{color:#C9C9CE;font-weight:400}
.nav-links a:hover{background:#fff;color:var(--ink)}
.hero{padding:44px 0 90px;overflow:hidden}
.blob{display:none}
.pill{background:#fff;box-shadow:none;color:var(--ink2);font-weight:500}
.pill i{background:var(--lime);box-shadow:0 0 0 4px rgba(212,241,91,.45)}
.hero h1{font-weight:500;letter-spacing:-.04em}
.hl{font-family:var(--fd);font-style:normal;font-weight:inherit;letter-spacing:inherit;background:var(--lav);-webkit-text-fill-color:var(--ink);color:var(--ink);border-radius:.3em;padding:0 .18em}
.hero p.lead{color:var(--ink2);font-weight:400}
.mode-btn{border-radius:26px;box-shadow:none}
.mode-btn::before{background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%)}
.mode-btn.p{background:var(--ink);color:#fff;box-shadow:none}
.mode-btn.p .mi{background:var(--lime);box-shadow:none}
.mode-btn.p .mi svg{stroke:var(--ink)}
.mode-btn.p::after{color:var(--lime)}
.mode-btn.u{background:var(--lav);color:var(--ink);backdrop-filter:none;box-shadow:none}
.mode-btn.u .mi{background:#fff}
.mode-btn.u .mi svg{stroke:var(--ink)}

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));

}

function modal(html, { wide = false } = {}) {

  const bg = root.firstElementChild;

    bg.classList.add('out'); setTimeout(() => { if (bg.parentNode === root) root.innerHTML = ''; }, 220); };

function watchFit(stage) {
  if (fitObs) fitObs.forEach(o => o.disconnect());
  let raf = 0;
  const fit = () => { raf = 0; const a = stage.firstElementChild; if (!a) return;
    a.style.zoom = ''; let z = 1;
    for (let k = 0; k < 4; k++) { const ch = a.clientHeight, sh = a.scrollHeight; if (!ch || sh <= ch + 1) break; z = Math.max(0.6, z * ch / sh); a.style.zoom = z.toFixed(4); if (z <= 0.6) break; }

    $$('.ff-board,.qa-list,.oe,.fl-list', stage).forEach(l => { const lb = l.getBoundingClientRect().bottom + 1; let n = 0; for (const c of l.children) if (c.getBoundingClientRect().bottom > lb) n++; const t = n ? '+' + n + ' more' : ''; for (const x of [l, l.parentElement]) if (x && x.dataset.more !== t) x.dataset.more = t; }); };
  const ask = () => { if (!raf) raf = requestAnimationFrame(fit); };

  fitObs = [mo, ro]; ask();
  return () => { mo.disconnect(); ro.disconnect(); stage.removeEventListener('load', ask, true); fitObs = null; };
}

}

/* =====================================================================
   5. DATA LAYER  — LocalStore (demo) and FirebaseStore (production)
   Both expose the same API so the UI never cares which one is active.
   ===================================================================== */
const LocalStore = (() => {
  const subs = new Set();
  const chan = 'BroadcastChannel' in window ? new BroadcastChannel('mentee-mentor') : null;
  const fire = k => subs.forEach(f => f(k));
  const emit = k => { fire(k); chan && chan.postMessage(k); };
  if (chan) chan.onmessage = e => fire(e.data);
  window.addEventListener('storage', e => e.key && fire(e.key));
  const PK = 'mm_presentations';
  const all = () => LS.getJSON(PK, {});
  const rk = c => 'mm_r_' + c;
  const on = (key, fn) => { const f = k => { if (k === key) fn(); }; subs.add(f); return () => subs.delete(f); };
  const patchResp = (code, id, fn) => { const arr = LS.getJSON(rk(code), []); const r = arr.find(x => x.id === id); if (!r) return; fn(r); LS.setJSON(rk(code), arr); emit(rk(code)); };
  return {
    mode: 'demo',
    async init() {},
    now() { return Date.now(); },
    ts() { return Date.now(); },
    async list() { return Object.values(all()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); },
    async get(code) { return all()[code] || null; },
    async save(p) { const a = all(); a[p.code] = { ...(a[p.code] || {}), ...clone(p), updatedAt: Date.now() }; LS.setJSON(PK, a); emit(PK); },
    async update(code, patch) { const a = all(); if (!a[code]) return; Object.assign(a[code], patch); LS.setJSON(PK, a); emit(PK); },
    async remove(code) { const a = all(); delete a[code]; LS.setJSON(PK, a); LS.del(rk(code)); emit(PK); },
    watch(code, cb) { const run = () => cb(all()[code] || null); run(); return on(PK, run); },
    async addResponse(code, slideId, data) { const arr = LS.getJSON(rk(code), []); arr.push({ id: rid(12), slideId, voter: voterId(), data, ts: Date.now(), up: [], answered: false }); LS.setJSON(rk(code), arr); emit(rk(code)); },
    watchResponses(code, slideId, cb) { const run = () => cb(LS.getJSON(rk(code), []).filter(r => r.slideId === slideId)); run(); return on(rk(code), run); },
    watchAll(code, cb) { const run = () => cb(LS.getJSON(rk(code), [])); run(); return on(rk(code), run); },
    async toggleUpvote(code, id, vid) { patchResp(code, id, r => { r.up = r.up || []; const i = r.up.indexOf(vid); i >= 0 ? r.up.splice(i, 1) : r.up.push(vid); }); },
    async setAnswered(code, id, v) { patchResp(code, id, r => r.answered = v); },
    async clearAll(code) { LS.del(rk(code)); emit(rk(code)); },
    async clearResponses(code, slideId) { LS.setJSON(rk(code), LS.getJSON(rk(code), []).filter(r => r.slideId !== slideId)); emit(rk(code)); }
  };
})();

const FirebaseStore = (() => {
  // ---- Firebase REALTIME DATABASE adapter ----
  // Data layout:  /presentations/{code}            -> presentation (title, slides, live state)
  //               /responses/{code}/{pushId}       -> { slideId, voter, data, ts, up:{voterId:true}, answered }
  let db, offset = 0;
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  const P = c => db.ref(c ? 'presentations/' + c : 'presentations');
  const R = c => db.ref('responses/' + c);
  // RTDB stores arrays as objects with numeric keys and drops empty arrays — normalise on read
  const toArr = x => Array.isArray(x) ? x : (x && typeof x === 'object') ? Object.keys(x).sort((a, b) => a - b).map(k => x[k]) : [];
  const isNumObj = x => x && typeof x === 'object' && !Array.isArray(x) && Object.keys(x).length && Object.keys(x).every(k => /^\d+$/.test(k));
  const normP = v => {
    if (!v) return null;
    const fix = o => { ['options', 'items', 'statements', 'fields', 'images'].forEach(k => { if (k in o || isNumObj(o[k])) o[k] = toArr(o[k]); }); return o; };
    v.slides = toArr(v.slides).map(sl => { fix(sl); if (sl.questions) sl.questions = toArr(sl.questions).map(fix); return sl; });
    v.resets = v.resets || {}; v.fffState = v.fffState || {}; return v;
  };
  const normR = (id, r) => {
    const data = r.data || {}; Object.keys(data).forEach(k => { if (isNumObj(data[k])) data[k] = toArr(data[k]); });
    return { id, ...r, data, up: r.up ? Object.keys(r.up) : [], answered: !!r.answered };
  };
  // Surface real problems instead of hanging silently
  const friendly = e => {
    const m = String(e && (e.code || e.message) || e);
    if (/permission/i.test(m)) return new Error('Permission denied — publish the Realtime Database rules (Rules tab), they are still locked.');
    return e instanceof Error ? e : new Error(m);
  };
  const T = (p, what) => Promise.race([
    Promise.resolve(p).catch(e => { throw friendly(e); }),
    new Promise((_, rej) => setTimeout(() => rej(new Error('No reply from Realtime Database while ' + what + '. Check that databaseURL in CONFIG exactly matches the URL on Realtime Database → Data.')), 12000))
  ]);
  const listen = (q, fn) => { const h = q.on('value', fn, e => console.error('Realtime Database:', e.message)); return () => q.off('value', h); };
  return {
    mode: 'firebase',
    now() { return Date.now() + offset; },
    ts() { return firebase.database.ServerValue.TIMESTAMP; },
    async init() {
      const v = '10.12.2';
      await load(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
      await load(`https://www.gstatic.com/firebasejs/${v}/firebase-database-compat.js`);
      firebase.initializeApp(CONFIG.firebaseConfig);
      db = firebase.database();
      // Server clock offset — so every device's countdown and every answer's timestamp agree
      db.ref('.info/serverTimeOffset').on('value', s => { offset = Number(s.val()) || 0; });
    },
    async list() { const s = await T(P().once('value'), 'loading presentations'); return Object.values(s.val() || {}).map(normP).filter(Boolean).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); },
    async get(code) { const s = await T(P(code).once('value'), 'reading a presentation'); return normP(s.val()); },
    async save(p) { await T(P(p.code).update({ ...clone(p), updatedAt: Date.now() }), 'saving'); },
    async update(code, patch) { await T(P(code).update(clone(patch)), 'updating'); },
    async remove(code) { await T(db.ref().update({ ['presentations/' + code]: null, ['responses/' + code]: null }), 'deleting'); },
    watch(code, cb) { return listen(P(code), s => cb(normP(s.val()))); },
    async addResponse(code, slideId, data) { await T(R(code).push({ slideId, voter: voterId(), data: clone(data), ts: firebase.database.ServerValue.TIMESTAMP, answered: false }), 'sending an answer'); },
    watchAll(code, cb) { return listen(R(code), s => cb(Object.entries(s.val() || {}).map(([id, r]) => normR(id, r)))); },
    watchResponses(code, slideId, cb) { return listen(R(code).orderByChild('slideId').equalTo(slideId), s => cb(Object.entries(s.val() || {}).map(([id, r]) => normR(id, r)))); },
    async toggleUpvote(code, id, vid, has) { await R(code).child(id + '/up/' + vid).set(has ? null : true); },
    async setAnswered(code, id, v) { await R(code).child(id + '/answered').set(!!v); },
    async clearAll(code) { await T(R(code).remove(), 'resetting responses'); },
    async clearResponses(code, slideId) {
      const s = await R(code).orderByChild('slideId').equalTo(slideId).once('value');
      const u = {}; s.forEach(ch => { u[ch.key] = null; });
      if (Object.keys(u).length) await R(code).update(u);
    }
  };
})();

// Morph keeps existing DOM nodes when only values change, so bars animate smoothly.
function morph(el, key, html) {
  if (el.dataset.mkey === key) {
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    const nn = $$('[data-k]', tmp);
    const old = new Map($$('[data-k]', el).map(n => [n.dataset.k, n]));
    let same = nn.length === old.size && nn.every(n => old.has(n.dataset.k));
    if (same) {
      nn.forEach(n => { const o = old.get(n.dataset.k);
        const st = n.getAttribute('style') || ''; if (st !== (o.getAttribute('style') || '')) o.setAttribute('style', st);
        if (n.hasAttribute('data-text') && o.textContent !== n.textContent) o.textContent = n.textContent; });
      $$('[data-t]', tmp).forEach(n => { const o = $(`[data-t="${n.dataset.t}"]`, el); if (o) o.textContent = n.textContent; });
      return;
    }
    const seen = new Set(old.keys());
    el.innerHTML = html;
    $$('[data-k]', el).forEach(n => { if (seen.has(n.dataset.k)) n.classList.add('seen'); });
    return;
  }
  el.dataset.mkey = key; el.innerHTML = html;
}
const normWord = w => String(w ?? '').toLowerCase().normalize('NFKC').replace(/[^\p{L}\p{N}\s'-]/gu, '').replace(/\s+/g, ' ').replace(/^[-']+|[-']+$/g, '').trim().slice(0, 30);
const emptyRes = (emoji, txt) => `<div class="empty-res"><span class="bounce">${emoji}</span>${txt}</div>`;
const pctOf = (v, a, b) => b === a ? 0 : clamp((v - a) / (b - a) * 100, 0, 100);

function renderResults(slide, res, st = {}) {
  const sid = slide.id; let key = slide.type + ':' + sid, html = '';
  switch (slide.type) {
    case 'mc': {
      const n = slide.options.length, counts = Array(n).fill(0);
      res.forEach(r => (r.data.choices || []).forEach(i => { if (i < n) counts[i]++; }));
      const max = Math.max(1, ...counts), tot = counts.reduce((a, b) => a + b, 0) || 1;
      key += ':' + n;
      html = `<div class="mc-res">${slide.options.map((o, i) => `<div class="mc-col">
        <div class="mc-val"><b data-k="c${i}" data-text>${counts[i]}</b><span data-k="p${i}" data-text>${Math.round(counts[i] / tot * 100)}%</span></div>
        <div class="mc-track"><div class="mc-fill grow-y" data-k="f${i}" style="height:${Math.max(counts[i] / max * 100, 1.5)}%;background:${PALETTE[i % PALETTE.length]}"></div></div>
        <div class="mc-lab">${esc(o)}</div></div>`).join('')}</div>`;
      break;
    }
    case 'wordcloud': {
      // Same word from several people = bigger. "Dog", "dog!" and " DOG " count as one word; one person counts once per word.
      const f = {};
      res.forEach(r => { const seen = new Set(); (r.data.words || []).forEach(w => { const k = normWord(w); if (!k || seen.has(k)) return; seen.add(k); f[k] = (f[k] || 0) + 1; }); });
      const ent = Object.entries(f).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 70);
      if (!ent.length) { html = emptyRes('☁️', 'Words will float in here…'); key += ':e'; break; }
      const max = ent[0][1], min = ent[ent.length - 1][1];
      const big = ent.length < 8 ? 96 : ent.length < 25 ? 84 : 70, small = 20;

const POINTS_PER_Q = 5;
const scorable = s => isRace(s) && !!fffCorrectText(s);
function scoreBoard(p, all) {
  const qs = (p.slides || []).filter(scorable), names = {}, rows = {};

  qs.forEach(s => {
    const fs = (p.fffState || {})[s.id] || {}; if (!fs.start) return;
    fffRanked(s, all.filter(r => r.slideId === s.id), fs.start).forEach(r => {
      const row = rows[r.voter] = rows[r.voter] || { voter: r.voter, pts: 0, correct: 0, answered: 0, ms: 0 };
      row.answered++; if (r.data.name && r.data.name !== 'Anonymous') names[r.voter] = r.data.name;

function fffBoard(s, ranked, { me = null, max = 100 } = {}) {

      <div class="ff-rank ${i < 3 ? 'm' : ''}">${i < 3 ? medal[i] : i + 1}</div>
      <div class="ff-name">${esc(r.data.name || 'Anonymous')}${r === win ? (s.mode === 'buzzer' ? ' 🔔' : ' 🏆') : ''}</div>
      <div class="ff-ans">${esc(fffAnswer(s, r.data))}</div>

      <div class="ff-mark ${r.ok === true ? 'ok' : r.ok === false ? 'bad' : ''}">${r.ok === true ? '✓' : r.ok === false ? '✗' : ''}${r.ok === true ? `<small>+${POINTS_PER_Q}</small>` : ''}</div></div>`).join('')}</div>`;

    const key = 'sc:' + slide.id + ':' + phase + ':' + (st.preview ? hashStr(slide.scenario || '') : '');

      <div class="sc-para ${long ? 'long' : ''}">${scenarioHTML(slide)}</div>

/* Sample data for the editor preview */
function sampleResponses(slide) {
  const R = seeded(hashStr(slide.id + slide.type + JSON.stringify(slide).length)); const ri = n => Math.floor(R() * n);
  const N = 14, out = [];
  const words = ['curious', 'fun', 'robots', 'creative', 'teamwork', 'coding', 'awesome', 'wow', 'learning', 'smart', 'sensors', 'fun', 'curious', 'robots', 'fun'];
  const texts = ['Building the line follower was amazing!', 'I finally understood how sensors work', 'Loved the teamwork', 'Can we do more coding?', 'The demo was so cool', 'Design thinking helps me plan better'];
  for (let k = 0; k < N; k++) {
    const id = 's' + k; let data;
    switch (slide.type) {
      case 'mc': data = { choices: [Math.min(ri(slide.options.length + 1), slide.options.length - 1)] }; break;
      case 'wordcloud': data = { words: [words[ri(words.length)], words[ri(words.length)]] }; break;
      case 'open': data = { text: texts[k % texts.length] }; if (k > 5) continue; break;
      case 'scales': data = { values: slide.statements.map(() => slide.min + ri(slide.max - slide.min + 1)) }; break;
      case 'ranking': { const o = [...slide.items.keys()]; for (let i = o.length - 1; i > 0; i--) { const j = ri(i + 1); [o[i], o[j]] = [o[j], o[i]]; } data = { order: o }; break; }
      case 'qa': if (k > 3) continue; data = { text: ['How do I start learning robotics at home?', 'Which microcontroller is best for beginners?', 'Can we use AI in our school project?', 'What sensors does a smart car need?'][k] }; break;
      case 'guess': data = { value: clamp(Math.round(slide.correct + (R() + R() + R() - 1.5) * (slide.max - slide.min) / 4), slide.min, slide.max) }; break;
      case 'points': { let left = slide.budget; data = { points: slide.items.map((_, i, a) => { const v = i === a.length - 1 ? left : ri(left + 1); left -= v; return v; }) }; break; }
      case 'grid': data = { xy: slide.items.map(() => ({ x: slide.gmin + R() * (slide.gmax - slide.gmin), y: slide.gmin + R() * (slide.gmax - slide.gmin) })) }; break;
      case 'form': if (k > 3) continue; data = { values: slide.fields.map(f => f.type === 'textarea' ? 'More hands-on time please!' : 'Sample answer') }; break;
      case 'pin': data = { x: 20 + R() * 60, y: 25 + R() * 50 }; break;
      case 'fff': case 'scenario': case 'imgq': { if (k > 7) continue; const nm = ['Aarav', 'Diya', 'Kabir', 'Ananya', 'Rohan', 'Meera', 'Ishaan', 'Sana'][k];
        if (slide.mode === 'mc') data = { name: nm, choice: ri(slide.options.length) };
        else if (slide.mode === 'buzzer') data = { name: nm, buzz: true };
        else if (slide.mode === 'order') data = { name: nm, order: k % 3 === 1 ? fffShuffle((slide.items || []).length, k + 7) : [...(slide.items || []).keys()] };
        else if (slide.mode === 'open') data = { name: nm, text: texts[k % texts.length] };
        else { data = { name: nm, text: (slide.answer || 'Answer').split(',')[0].trim() || 'Answer' }; if (k % 3 === 2) data.text = 'Not sure'; }
        break; }
    }
    out.push({ id, slideId: slide.id, voter: 'v' + k, data, ts: isFF(slide) ? 700 + k * 900 + ri(500) : k, up: Array(ri(6)).fill('x'), answered: false });
  }
  return out;
}

function compressImage(file, maxW = 1000, q = .78) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      const k = Math.min(1, maxW / img.width), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', q)); }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

    if ($('#b-rev')) $('#b-rev').onclick = () => Store.update(code, { reveal: !p.reveal });
    if ($('#b-fstart')) $('#b-fstart').onclick = () => setFS(s, { start: Store.ts(), shown: false });
    if ($('#b-read')) $('#b-read').onclick = () => setFS(s, { read: Store.ts(), shown: false });
    if ($('#b-skip')) $('#b-skip').onclick = () => setFS(s, { start: Store.ts() });

}

  /* ---------- Fastest Fingers First (participant) ---------- */
  function fff(s, reset) {
    const am = $('#am'), fs = (p.fffState || {})[s.id] || {}, lim = fffLimit(s), vk = votedKey(s, reset), name = myName() || 'Anonymous';
    const left = () => (fs.start || 0) + lim - Store.now();

      am.innerHTML = `<div class="card aud-card">${head(s)}${who(true)}<div class="ff-state" style="padding:20px 0"><span class="em">🏁</span><h2 style="font-size:28px">Get ready!</h2>
        <p>${s.mode === 'buzzer' ? 'The buzzer unlocks when the presenter opens it.<br>Hit it <b style="color:var(--ink)">first</b> to get the first chance to answer! 🔔'
